body{margin:0;background:var(--shell);color:var(--ink);font:15px/1.5 var(--mono);-webkit-font-smoothing:antialiased}

.seg{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--rule)}

.segL{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted);margin-top:6px}

.shapes .seg{height:12px}

table.matrix{width:100%;border-collapse:collapse;font-size:13px}
table.matrix th,table.matrix td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--rule)}
table.matrix th:first-child,table.matrix td:first-child{text-align:left;color:var(--muted);font-weight:500}
table.matrix thead th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;border-bottom:2px solid var(--rule)}
table.matrix thead th.under{color:var(--jade)}
table.matrix thead th.over{color:var(--rust)}
table.matrix td{font-variant-numeric:tabular-nums;font-weight:600}
table.matrix tr.secHead td{font:600 11px var(--mono);letter-spacing:.03em;color:var(--muted);padding-top:18px;border-bottom:2px solid var(--rule);text-transform:uppercase}
table.matrix thead th .zr{display:block;font-size:10px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:2px}
table.matrix thead th .zr.zn{font-weight:600;color:var(--ink)}

.labsPop{font-size:12px;line-height:1.6;color:var(--ink);background:var(--jade-soft);border:1px solid color-mix(in srgb,var(--jade) 35%,transparent);border-radius:8px;padding:10px 12px;margin:0 0 12px;max-width:78ch}
.labsTag{cursor:pointer;background:transparent;display:inline-block;font:600 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--jade);border:1px solid var(--jade);border-radius:999px;padding:3px 7px;margin-left:8px;vertical-align:2px}
.pvTop{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:14px;align-items:stretch;margin:4px 0 22px}
.pvBig{border:1px solid var(--jade);border-radius:12px;padding:18px 18px 16px;background:var(--jade-soft);display:flex;flex-direction:column;justify-content:center}
.pvBig .v{font:500 58px/1 var(--serif);color:var(--jade);font-variant-numeric:tabular-nums}
.pvBig .l{font-size:12px;color:var(--ink);margin-top:8px}
.pvTiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pvTiles .st .v{font-size:24px}
.pvTiles .st .v small{margin:0 2px}
table.tb tr.thin td{opacity:.5}
@media(max-width:700px){.pvTop{grid-template-columns:1fr}}
.tb.bt thead th.g{text-align:center;border-bottom:1px solid var(--rule)}
.tb.bt th.rc,.tb.bt td.rc{background:color-mix(in srgb,var(--jade-soft) 55%,transparent)}
.btLists{margin-top:14px;display:grid;gap:6px}
.btL{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:12px}
.btL summary{cursor:pointer;color:var(--jade);font-weight:600}
.btL p{margin:8px 0 2px;line-height:1.7}
.btL a{font-weight:700;text-decoration:none}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.foot .full{flex-basis:100%}

@media(max-width:880px){
  .stage{padding:14px}
  .sheet{padding:26px 18px 20px}
  table.matrix,table.tb{font-size:11.5px}
  .chart{height:250px}
}
</style>

<div class="stage"><article class="sheet" id="sheet"><div class="empty">Loading the universe…</div></article></div>
<script>
var LINKS={
  cardStock:   "https://tools.yieldsigma.com/card-undervalued.html?ticker=",
  cardReit:    "https://tools.yieldsigma.com/card-reits.html?ticker=",
  labs:        "https://www.stardustcapital.net/stardust-capital-labs",
  directory:   "https://www.yieldsigma.com/directory",
  methodology: "https://www.yieldsigma.com/methodology/yield-sigma-methodology",
  fieldGuide:  "https://www.yieldsigma.com/methodology/card-field-guide"
};
var GIST="https://gist.githubusercontent.com/feurgabi-create/94abe3b6de993ea6a6e888053b242b82/raw/";
</script>
<script>
(function(){
'use strict';
/* ---- shared with the heat map (schema, parsing, sigma, aggregate metrics, sector groups) ---- */
var SCHEMA_STOCKS=[
 {k:'nameRaw', label:'Company / Symbol', type:'text'},
 {k:'price', label:'Price', type:'money'},
 {k:'low52w', label:'52-week low', type:'money'},
 {k:'divDollar', label:'Div $', type:'num'},
 {k:'yield', label:'Yield', type:'pct'},
 {k:'avg10y', label:'10y average yield', type:'pct'},
 {k:'oneSD', label:'1 SD (yield)', type:'pct'},
 {k:'divGrowth10y', label:'Div growth, past 10y', type:'pct'},
 {k:'sigma', label:'Sigma', type:'num'},
 {k:'ticker', label:'Ticker', type:'text'},
 {k:'direction', label:'Direction', type:'text'},
 {k:'ddm', label:'DDM fair value', type:'num'},
 {k:'par', label:'Par (yield-parity price)', type:'money'},
 {k:'volatility', label:'Volatility (yield / SD)', type:'pct'},
 {k:'notes', label:'Notes', type:'text'},
 {k:'cagr5y', label:'5y CAGR (dividend)', type:'pct'},
 {k:'cagr10y', label:'10y CAGR (dividend)', type:'pct'},
 {k:'pe', label:'P/E', type:'num'},
 {k:'ma200', label:'200 dma', type:'money'},
 {k:'ma200diff', label:'200 dma, % diff', type:'pct'},
 {k:'maxSigma', label:'Max sigma (historical)', type:'num'},
 {k:'avMaxY', label:'Yield at max sigma', type:'pct'},
 {k:'max1std', label:'SD at max sigma', type:'pct'},
 {k:'maxDiffCurrent', label:'Max sigma vs current, gap', type:'pct'},
 {k:'volMY', label:'Volatility (max-yield period)', type:'pct'},
 {k:'parMY', label:'Par price (max-yield period)', type:'money'},
 {k:'price1sig', label:'Price at 1 sigma (max-yield model)', type:'money'},
 {k:'price2sig', label:'Price at 2 sigma (max-yield model)', type:'money'},
 {k:'yieldPremium', label:'Yield premium vs long-term average', type:'pct'},
 {k:'divIn10y', label:'Projected dividend, 10y', type:'num'},
 {k:'divChecks10y', label:'Dividend check, 10y', type:'num'},
 {k:'pv', label:'PV', type:'num'},
 {k:'tnxSpread', label:'Yield spread to 10y Treasury', type:'text'},
 {k:'divGrowthYears', label:'Years of consecutive dividend growth', type:'num'},
 {k:'payoutRatio', label:'Payout ratio', type:'pct'},
 {k:'divGrowth3y', label:'Div growth, past 3y', type:'pct'}
];
var SCHEMA_STOCKS_BY_KEY={};
SCHEMA_STOCKS.forEach(function(f){SCHEMA_STOCKS_BY_KEY[f.k]=f;});
var REIT_FIELD_ORDER=['nameRaw','price','low52w','divDollar','yield','avg10y','oneSD',
 'divGrowth10y','sigma','ticker',
 {k:'yieldDiffK', label:'Yield difference (col K)', type:'pct'},
 'par','volatility','notes',
 {k:'fv5yr', label:'5yr forward value (not used)', type:'num'},
 'cagr5y','cagr10y',
 {k:'pffr', label:'Price/FFO (not used)', type:'pct'},
 'ma200','ma200diff','maxSigma','avMaxY','max1std','maxDiffCurrent',
 'volMY','parMY','price1sig','price2sig','tnxSpread','divGrowthYears',
 {k:'affo', label:'AFFO per share (diluted)', type:'money'},
 {k:'pAffo', label:'P/AFFO', type:'num'},
 'payoutRatio','divGrowth3y',
 'direction'];   /* AI: Direction, from the REIT snapshot (ModuleYSSnap v2) */
var SCHEMA_REITS=REIT_FIELD_ORDER.map(function(f){return typeof f==='string'?SCHEMA_STOCKS_BY_KEY[f]:f;});
var ALL_SCHEMA_KEYS=(function(){
  var seen={},keys=[];
  SCHEMA_STOCKS.concat(SCHEMA_REITS).forEach(function(f){if(!seen[f.k]){seen[f.k]=true;keys.push(f.k);}});
  return keys;
})();

var $=function(s){return document.querySelector(s);};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function parseMoney(s){
  if(s===null||s===undefined)return null;
  var t=String(s).trim();if(!t)return null;
  var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
  t=t.replace(/[^0-9.\-]/g,'');
  if(t===''||t==='-')return null;
  var v=parseFloat(t);if(!isFinite(v))return null;
  return neg?-v:v;
}
function parsePct(s){
  if(s===null||s===undefined)return null;
  var t=String(s).trim();if(!t)return null;
  var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
  t=t.replace(/[^0-9.\-]/g,'');
  if(t===''||t==='-')return null;
  var v=parseFloat(t);if(!isFinite(v))return null;
  return neg?-v:v;
}
function parseNum(s){
  if(s===null||s===undefined)return null;
  var t=String(s).trim();if(!t)return null;
  var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
  t=t.replace(/[^0-9.\-]/g,'');
  if(t===''||t==='-')return null;
  var v=parseFloat(t);if(!isFinite(v))return null;
  return neg?-v:v;
}
function parseText(s){return (s===null||s===undefined)?'':String(s).trim();}
function trimZ(s){return s.indexOf('.')>=0?s.replace(/\.?0+$/,''):s;}
function fmtMoney(v){if(v===null)return '\u2013';return (v<0?'-$':'$')+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(v){if(v===null)return '\u2013';return trimZ(v.toFixed(2))+'%';}
function fmtNum(v,d){if(v===null)return '\u2013';return trimZ(v.toFixed(d===undefined?2:d));}
function fmtBps(v){if(v===null)return '\u2013';var b=Math.round(v*100);return (b>=0?'+':'')+b+'bps';}

function splitRow(line){
  var cells=line.split('\t');
  if(cells.length<10)cells=line.split(/ {2,}/);
  return cells.map(function(c){return c===undefined?'':c;});
}
function parseRow(line,schema){
  schema=schema||SCHEMA_STOCKS;
  var cells=splitRow(line);
  var rec={},issues=[];
  ALL_SCHEMA_KEYS.forEach(function(k){rec[k]=null;});
  schema.forEach(function(f,i){
    var raw=cells[i];
    var v;
    if(f.type==='money')v=parseMoney(raw);
    else if(f.type==='pct')v=parsePct(raw);
    else if(f.type==='num')v=parseNum(raw);
    else v=parseText(raw);
    rec[f.k]=v;
  });
  if(cells.length!==schema.length)issues.push(cells.length+' columns found, expected '+schema.length+'.');
  if(!rec.nameRaw)issues.push('No company name in the first column.');
  return {rec:rec,issues:issues,label:(rec.ticker||rec.nameRaw||'Row')};
}
function erf(x){
  var s=x<0?-1:1;x=Math.abs(x);
  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  var t=1/(1+p*x);
  var y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return s*y;
}
function normCdf(z){return 0.5*(1+erf(z/Math.SQRT2));}
function splitNameExch(raw){
  var m=raw.match(/^(.*?)\s*\(([^:()]+):([^:()]+)\)\s*$/);
  if(m)return {name:m[1].trim(),exch:m[2].trim(),tick:m[3].trim()};
  return {name:raw,exch:'',tick:''};
}
function parseTnx(raw){
  var m=raw.match(/Now:\s*([^|]+)\|\s*10Y:\s*([^|]+)\|\s*Diff:\s*(.+)/i);
  if(!m)return null;
  return {now:m[1].trim(),ten:m[2].trim(),diff:m[3].trim()};
}
function tnxDiffSign(s){
  var v=parseFloat(String(s).replace('%',''));
  return isFinite(v)?v:0;
}
/* Sigma sign convention (matches the sigma card exactly): negative =
   "rich"/overvalued (yield abnormally low vs its own 10y average),
   positive = "cheap"/undervalued (yield abnormally high). */
function analyzeRow(rec){
  var a={};
  var ne=splitNameExch(rec.nameRaw||'');
  a.name=ne.name; a.ticker=rec.ticker||ne.tick||'\u2013';
  var sigma=rec.sigma;
  var sigmaComputed=null;
  if(rec.yield!==null&&rec.avg10y!==null&&rec.oneSD)sigmaComputed=(rec.yield-rec.avg10y)/rec.oneSD;
  a.sigma=sigma!==null?sigma:sigmaComputed;
  a.tnx=parseTnx(rec.tnxSpread||'');
  return a;

/* Company-name abbreviation — same dictionary as the sigma card, used

      else field+=c;

   prediction is the stock price at which the yield would be back at its 10-year average. Did the
   stock price get there? "Came true" allows 10% short of the predicted stock price.
   Yields here are rebuilt from history.csv: the yearly dividend amount over the monthly stock price,

/* Labs pill: a click opens the explanation under the title */

var PV_CACHE={};

function pvEvents(U){
  var ck=UNI;if(PV_CACHE[ck])return PV_CACHE[ck];

  withHist(U).forEach(function(x){
    var h=D.hist[x.k],z=h.z,p=h.p,dy=h.dy,n=z.length;if(!p||!p.length||p[0]===null)return;
    var yr=function(i){return Math.floor((h.st+i)/12);},dv=function(i){return dy[yr(i)]||dy[yr(i)-1]||0;};
    var Y=[],A=[],i,j,k;

    for(i=0;i<n;i++){var sm=0,c=0;for(j=Math.max(0,i-119);j<=i;j++)if(Y[j]!==null){sm+=Y[j];c++;}A.push(c>=60?sm/c:null);}

            var pred=Y[i]/A[i]-1,tgt=p[i]*(1+pred),ok=function(v){return sd>0?v>=tgt*0.9:v<=tgt*1.1;};
            var e={sd:sd,pred:pred,tier:pvTier(streakAt(yr(i))),sec:GKEY[x.k],left:n-1-i};
            [12,24].forEach(function(hz){if(i+hz<n){e['a'+hz]=p[i+hz]/p[i]-1;var hit=false;for(k=i+1;k<=i+hz;k++)if(ok(p[k])){hit=true;break;}e['by'+hz]=hit;}});
            var ev=false;for(k=i+1;k<n;k++)if(ok(p[k])){ev=true;break;}e.ever=ev;
            out.push(e);
          }
          i=j<n?j+1:n;
        }else i++;

    });
  });
  PV_CACHE[ck]=out;return out;
}

/* ---- Yield Sigma backtest: hypothetical portfolios ----
   At the end of a past month, take the names with the highest sigma (most undervalued) and the
   lowest sigma (most overvalued), equal weight, buy once and hold to the last completed month.
   Return = stock price change plus the dividends paid along the way (yearly dividend amount / 12
   per month, not reinvested). Benchmarks: all names equal weight, and SPY when its history is there. */
var BT_H=[[6,'Last 6 months'],[12,'Last year'],[60,'Last 5 years'],[120,'Last 10 years'],[180,'Last 15 years'],[240,'Last 20 years']];
function btRet(h,i,k){var d=0;for(var j=i+1;j<=i+k;j++){var y=Math.floor((h.st+j)/12);d+=(h.dy[y]||h.dy[y-1]||0)/12;}return (h.p[i+k]+d)/h.p[i]-1;}
/* dividends reinvested: each month's dividend buys more shares at that month's stock price */
function btRetC(h,i,k){var sh=1;for(var j=i+1;j<=i+k;j++){var y=Math.floor((h.st+j)/12),dm=(h.dy[y]||h.dy[y-1]||0)/12;if(h.p[j]>0)sh*=1+dm/h.p[j];}return sh*h.p[i+k]/h.p[i]-1;}
/* signal strategy: buy a name in the month it is at +1 sigma or higher, sell it in the month it is at
   -1 sigma or lower. Names held at the same time are equal weight, rebalanced monthly; with nothing
   held the money sits in cash (0%). Paid out: dividends collected as cash. Reinvested: compounded. */
function btSignal(U,m0,m1){
  var H=withHist(U).map(function(x){return D.hist[x.k];}).filter(function(h){return h.p&&h.p.length;});
  var held=[],V=1,VP=1,cash=0,t,j;
  var zAt=function(h,m){var i=m-h.st;return i>=0&&i<h.z.length?h.z[i]:null;};
  H.forEach(function(h,k){var z=zAt(h,m0);held[k]=z!==null&&z>=1;});
  for(t=m0;t<m1;t++){
    var rp=0,rd=0,n=0;
    H.forEach(function(h,k){
      if(!held[k])return;var i=t-h.st;if(i<0||i+1>=h.z.length||!(h.p[i]>0)||!(h.p[i+1]>0))return;
      var y=Math.floor((h.st+i+1)/12),dm=(h.dy[y]||h.dy[y-1]||0)/12;
      rp+=h.p[i+1]/h.p[i]-1;rd+=dm/h.p[i];n++;
    });
    if(n){rp/=n;rd/=n;cash+=VP*rd;VP*=1+rp;V*=1+rp+rd;}
    H.forEach(function(h,k){var z=zAt(h,t+1);if(z===null)return;if(!held[k]&&z>=1)held[k]=true;else if(held[k]&&z<=-1)held[k]=false;});

}
/* rotation: every 3 months, hold the 10 names with the highest sigma (most undervalued), equal weight;
   names that drop out of the top 10 are sold. Paid out: dividends collected as cash. Reinvested: compounded. */
function btRotate(U,m0,m1,N,every){
  var H=withHist(U).map(function(x){return D.hist[x.k];}).filter(function(h){return h.p&&h.p.length;});
  var sel=[],V=1,VP=1,cash=0,t;
  var mr=function(h,t){var i=t-h.st;if(i<0||i+1>=h.z.length||!(h.p[i]>0)||!(h.p[i+1]>0))return null;var y=Math.floor((h.st+i+1)/12),dm=(h.dy[y]||h.dy[y-1]||0)/12;return [h.p[i+1]/h.p[i]-1,dm/h.p[i]];};
  for(t=m0;t<m1;t++){
    if((t-m0)%every===0){
      var c=[];H.forEach(function(h){var i=t-h.st;if(i<0||i>=h.z.length||mr(h,t)===null)return;c.push([h,h.z[i]]);});
      c.sort(function(a,b){return b[1]-a[1];});sel=c.slice(0,N).map(function(q){return q[0];});
    }
    var rp=0,rd=0,n=0;sel.forEach(function(h){var q=mr(h,t);if(!q)return;rp+=q[0];rd+=q[1];n++;});
    if(n){rp/=n;rd/=n;cash+=VP*rd;VP*=1+rp;V*=1+rp+rd;}
  }
  return {paid:VP+cash-1,re:V-1};
}
function btLast(){var m=-1e9;Object.keys(D.hist).forEach(function(k){var h=D.hist[k];m=Math.max(m,h.st+h.z.length-1);});return m;}

  var c=[];
  withHist(U).forEach(function(x){var h=D.hist[x.k],i=m-h.st;if(i<0||i+k>=h.z.length||!h.p||!(h.p[i]>0)||!(h.p[i+k]>0))return;c.push({x:x,z:h.z[i],r:btRet(h,i,k),rc:btRetC(h,i,k)});});
  var nb=Math.min(20,Math.floor(c.length/3));if(nb<5)return null;
  c.sort(function(a,b){return b.z-a.z;});

  var top=c.slice(0,nb),bot=c.slice(-nb).reverse();
  var spy=null,hs=D.hist.SPY;if(hs&&hs.p){var si=m-hs.st;if(si>=0&&si+k<hs.z.length&&hs.p[si]>0)spy=btRet(hs,si,k);}
  var rc=function(q){return q.rc;};
  var sgl=btRotate(U,m,m+k,10,3);

    topC:avg(top,rc),botC:avg(bot,rc),allC:avg(c,rc),

<script>
/* Opened over a Yield Sigma card (?embed=1): a click on a stock's card link sends the ticker back to that card. */
(function(){
  if(window.parent===window)return;
  var on=false;try{on=new URLSearchParams(location.search).get('embed')==='1';}catch(e){}
  if(!on)return;
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href*="ticker="]');if(!a)return;
    var m=a.getAttribute('href').match(/[?&]ticker=([^&#]+)/);if(!m)return;
    e.preventDefault();window.parent.postMessage({ysPick:decodeURIComponent(m[1])},'*');
  },true);
})();
</script>
