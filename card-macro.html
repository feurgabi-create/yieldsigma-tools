<script>

<script>
(function(){
'use strict';
/* ---- shared with the heat map (schema, parsing, sigma, aggregate metrics, sector groups) ---- */
var SCHEMA_STOCKS=[
 {k:'nameRaw', label:'Company / Symbol', type:'text'},
 {k:'price', label:'Price', type:'money'},
 {k:'low52w', label:'52-week low', type:'money'},
 {k:'divDollar', label:'Div $', type:'num'},
 {k:'yield', label:'Yield', type:'pct'},
 {k:'avg10y', label:'10y average yield', type:'pct'},
 {k:'oneSD', label:'1 SD (yield)', type:'pct'},
 {k:'divGrowth10y', label:'Div growth, past 10y', type:'pct'},
 {k:'sigma', label:'Sigma', type:'num'},
 {k:'ticker', label:'Ticker', type:'text'},
 {k:'direction', label:'Direction', type:'text'},
 {k:'ddm', label:'DDM fair value', type:'num'},
 {k:'par', label:'Par (yield-parity price)', type:'money'},
 {k:'volatility', label:'Volatility (yield / SD)', type:'pct'},
 {k:'notes', label:'Notes', type:'text'},
 {k:'cagr5y', label:'5y CAGR (dividend)', type:'pct'},
 {k:'cagr10y', label:'10y CAGR (dividend)', type:'pct'},
 {k:'pe', label:'P/E', type:'num'},
 {k:'ma200', label:'200 dma', type:'money'},
 {k:'ma200diff', label:'200 dma, % diff', type:'pct'},
 {k:'maxSigma', label:'Max sigma (historical)', type:'num'},
 {k:'avMaxY', label:'Yield at max sigma', type:'pct'},
 {k:'max1std', label:'SD at max sigma', type:'pct'},
 {k:'maxDiffCurrent', label:'Max sigma vs current, gap', type:'pct'},
 {k:'volMY', label:'Volatility (max-yield period)', type:'pct'},
 {k:'parMY', label:'Par price (max-yield period)', type:'money'},
 {k:'price1sig', label:'Price at 1 sigma (max-yield model)', type:'money'},
 {k:'price2sig', label:'Price at 2 sigma (max-yield model)', type:'money'},
 {k:'yieldPremium', label:'Yield premium vs long-term average', type:'pct'},
 {k:'divIn10y', label:'Projected dividend, 10y', type:'num'},
 {k:'divChecks10y', label:'Dividend check, 10y', type:'num'},
 {k:'pv', label:'PV', type:'num'},
 {k:'tnxSpread', label:'Yield spread to 10y Treasury', type:'text'},
 {k:'divGrowthYears', label:'Years of consecutive dividend growth', type:'num'},
 {k:'payoutRatio', label:'Payout ratio', type:'pct'},
 {k:'divGrowth3y', label:'Div growth, past 3y', type:'pct'}
];
var SCHEMA_STOCKS_BY_KEY={};
SCHEMA_STOCKS.forEach(function(f){SCHEMA_STOCKS_BY_KEY[f.k]=f;});
var REIT_FIELD_ORDER=['nameRaw','price','low52w','divDollar','yield','avg10y','oneSD',
 'divGrowth10y','sigma','ticker',
 {k:'yieldDiffK', label:'Yield difference (col K)', type:'pct'},
 'par','volatility','notes',
 {k:'fv5yr', label:'5yr forward value (not used)', type:'num'},
 'cagr5y','cagr10y',
 {k:'pffr', label:'Price/FFO (not used)', type:'pct'},
 'ma200','ma200diff','maxSigma','avMaxY','max1std','maxDiffCurrent',
 'volMY','parMY','price1sig','price2sig','tnxSpread','divGrowthYears',
 {k:'affo', label:'AFFO per share (diluted)', type:'money'},
 {k:'pAffo', label:'P/AFFO', type:'num'},
 'payoutRatio','divGrowth3y',
 'direction'];   /* AI: Direction, from the REIT snapshot (ModuleYSSnap v2) */
var SCHEMA_REITS=REIT_FIELD_ORDER.map(function(f){return typeof f==='string'?SCHEMA_STOCKS_BY_KEY[f]:f;});
var ALL_SCHEMA_KEYS=(function(){
  var seen={},keys=[];
  SCHEMA_STOCKS.concat(SCHEMA_REITS).forEach(function(f){if(!seen[f.k]){seen[f.k]=true;keys.push(f.k);}});
  return keys;
})();

var $=function(s){return document.querySelector(s);};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function parseMoney(s){
  if(s===null||s===undefined)return null;
  var t=String(s).trim();if(!t)return null;
  var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
  t=t.replace(/[^0-9.\-]/g,'');
  if(t===''||t==='-')return null;
  var v=parseFloat(t);if(!isFinite(v))return null;
  return neg?-v:v;
}
function parsePct(s){
  if(s===null||s===undefined)return null;
  var t=String(s).trim();if(!t)return null;
  var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
  t=t.replace(/[^0-9.\-]/g,'');
  if(t===''||t==='-')return null;
  var v=parseFloat(t);if(!isFinite(v))return null;
  return neg?-v:v;
}
function parseNum(s){
  if(s===null||s===undefined)return null;
  var t=String(s).trim();if(!t)return null;
  var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
  t=t.replace(/[^0-9.\-]/g,'');
  if(t===''||t==='-')return null;
  var v=parseFloat(t);if(!isFinite(v))return null;
  return neg?-v:v;
}
function parseText(s){return (s===null||s===undefined)?'':String(s).trim();}
function trimZ(s){return s.indexOf('.')>=0?s.replace(/\.?0+$/,''):s;}
function fmtMoney(v){if(v===null)return '\u2013';return (v<0?'-$':'$')+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(v){if(v===null)return '\u2013';return trimZ(v.toFixed(2))+'%';}
function fmtNum(v,d){if(v===null)return '\u2013';return trimZ(v.toFixed(d===undefined?2:d));}
function fmtBps(v){if(v===null)return '\u2013';var b=Math.round(v*100);return (b>=0?'+':'')+b+'bps';}

function splitRow(line){
  var cells=line.split('\t');
  if(cells.length<10)cells=line.split(/ {2,}/);
  return cells.map(function(c){return c===undefined?'':c;});
}
function parseRow(line,schema){
  schema=schema||SCHEMA_STOCKS;
  var cells=splitRow(line);
  var rec={},issues=[];
  ALL_SCHEMA_KEYS.forEach(function(k){rec[k]=null;});
  schema.forEach(function(f,i){
    var raw=cells[i];
    var v;
    if(f.type==='money')v=parseMoney(raw);
    else if(f.type==='pct')v=parsePct(raw);
    else if(f.type==='num')v=parseNum(raw);
    else v=parseText(raw);
    rec[f.k]=v;
  });
  if(cells.length!==schema.length)issues.push(cells.length+' columns found, expected '+schema.length+'.');
  if(!rec.nameRaw)issues.push('No company name in the first column.');
  return {rec:rec,issues:issues,label:(rec.ticker||rec.nameRaw||'Row')};
}
function erf(x){
  var s=x<0?-1:1;x=Math.abs(x);
  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  var t=1/(1+p*x);
  var y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return s*y;
}
function normCdf(z){return 0.5*(1+erf(z/Math.SQRT2));}
function splitNameExch(raw){
  var m=raw.match(/^(.*?)\s*\(([^:()]+):([^:()]+)\)\s*$/);
  if(m)return {name:m[1].trim(),exch:m[2].trim(),tick:m[3].trim()};
  return {name:raw,exch:'',tick:''};
}
function parseTnx(raw){
  var m=raw.match(/Now:\s*([^|]+)\|\s*10Y:\s*([^|]+)\|\s*Diff:\s*(.+)/i);
  if(!m)return null;
  return {now:m[1].trim(),ten:m[2].trim(),diff:m[3].trim()};
}
function tnxDiffSign(s){
  var v=parseFloat(String(s).replace('%',''));
  return isFinite(v)?v:0;
}
/* Sigma sign convention (matches the sigma card exactly): negative =
   "rich"/overvalued (yield abnormally low vs its own 10y average),
   positive = "cheap"/undervalued (yield abnormally high). */
function analyzeRow(rec){
  var a={};
  var ne=splitNameExch(rec.nameRaw||'');
  a.name=ne.name; a.ticker=rec.ticker||ne.tick||'\u2013';
  var sigma=rec.sigma;
  var sigmaComputed=null;
  if(rec.yield!==null&&rec.avg10y!==null&&rec.oneSD)sigmaComputed=(rec.yield-rec.avg10y)/rec.oneSD;
  a.sigma=sigma!==null?sigma:sigmaComputed;
  a.tnx=parseTnx(rec.tnxSpread||'');
  return a;
}
/* Company-name abbreviation — same dictionary as the sigma card, used
   only for the hover preview's full-name line. */
var COMPANY_WORD_ABBR={
  CORPORATION:'Corp',CORP:'Corp',COMPANY:'Co',CO:'Co',INCORPORATED:'Inc',INC:'Inc',
  LIMITED:'Ltd',LTD:'Ltd',INTERNATIONAL:'Intl',HOLDINGS:'Hldgs',HOLDING:'Hldg',
  INDUSTRIES:'Inds',ASSOCIATES:'Assoc',MANUFACTURING:'Mfg',
  PHARMACEUTICALS:'Pharma',PHARMACEUTICAL:'Pharma',GROUP:'Grp',
  COMMUNITIES:'Cmtys',COMMUNITY:'Cmty',PROPERTIES:'Props',PROPERTY:'Prop',
  APARTMENTS:'Apts',APARTMENT:'Apt',RESIDENTIAL:'Res',DEVELOPMENT:'Dev',DEVELOPMENTS:'Devs'
};
function abbreviateCompanyWord(w){
  var m=w.match(/^([A-Za-z]+)([,.]*)$/);
  if(!m)return w;
  var core=m[1].toUpperCase();
  return COMPANY_WORD_ABBR[core]||w;
}
function shortCompanyName(name){
  if(!name)return name;
  var words=name.trim().replace(/^THE\s+/i,'').split(/\s+/).map(abbreviateCompanyWord);   /* a leading "The" never shows */
  if(words.length<=3)return words.join(' ');
  var joined=words.join(' ').replace(/^THE\s+/i,'').trim();
  return joined.split(/\s+/).slice(0,3).join(' ').replace(/,$/,'');
}

/* ------------------------------------------------------------------ *
 * CSV parsing + live fetch — same as the sigma card.
 * ------------------------------------------------------------------ */
function parseCSV(text){
  var rows=[],row=[],field='',inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQuotes=false; }
      else field+=c;
    }else{
      if(c==='"')inQuotes=true;
      else if(c===',' ){row.push(field);field='';}
      else if(c==='\r'){}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  row.push(field);
  if(row.length>1||row[0]!=='')rows.push(row);
  return rows;
}
function csvTextToLines(text){
  var rows=parseCSV(text).filter(function(r){return r.some(function(c){return c.trim()!=='';});});
  var lines=rows.map(function(r){return r.join('\t').trim();}).filter(Boolean);

    var firstCells=splitRow(lines[0]);
    if(firstCells.length>1&&parseMoney(firstCells[1])===null)lines.shift();

}

/* Extra rows shown under "More stats" (collapsed by default). */
function directionValue(raw){
  if(raw===null||raw===undefined)return null;
  var s=String(raw);
  var up=/[⇧⬆↑▲▴↗]/.test(s);
  var down=/[⇩⇣⬇↓▼▾↘]/.test(s);
  var m=s.match(/[-+]?\d*\.?\d+/);
  if(!m)return null;
  var n=parseFloat(m[0]);
  if(!isFinite(n))return null;
  if(down&&!up)return -Math.abs(n);
  if(up&&!down)return Math.abs(n);
  return n;
}

function parseHist(txt){
  var L=String(txt||'').split(/\r?\n/),out={};if(!/^ticker\t/.test(L[0]||''))return out;
  var H=L[0].split('\t'),ix=function(n){return H.indexOf(n);};
  var iT=ix('ticker'),iTy=ix('type'),iF=ix('first'),iS=ix('shape'),iG=ix('grade'),iZ=ix('z');
  var now=new Date(),cur=now.getFullYear()*12+now.getMonth();
  for(var li=1;li<L.length;li++){
    var f=L[li].split('\t');if(f.length<=iZ||!f[iT])continue;
    var st=+f[iF].slice(0,4)*12+(+f[iF].slice(5,7)-1);if(!isFinite(st))continue;
    var z=f[iZ].split(',').map(function(v){v=v.trim();return v===''?null:+v;});
    while(z.length&&st+z.length-1>=cur)z.pop();                         /* completed months only */
    while(z.length&&(z[z.length-1]===null||!isFinite(z[z.length-1])))z.pop();
    while(z.length&&(z[0]===null||!isFinite(z[0]))){z.shift();st++;}
    for(var i=1;i<z.length;i++)if(z[i]===null||!isFinite(z[i]))z[i]=z[i-1];
    if(z.length<24)continue;
    out[key(f[iT])]={type:f[iTy]||'',st:st,z:z,grade:(f[iG]||'').trim(),shape:f[iS]===''?null:+f[iS]};
  }

}
function parseFund(txt){

}

/* ---- statistics ---- */
/* every time a name's sigma first reached the level (from inside it), how many months
   until it came back to 0 sigma (its 10-year average yield); open = not back yet */
function episodes(z,T,s){
  var out=[],i=1,n=z.length;
  while(i<n){
    if(s*z[i]>=T&&s*z[i-1]<T){
      var j=i+1;while(j<n&&s*z[j]>0)j++;
      if(j<n){out.push({i:i,mo:j-i,avail:n-1-i});i=j+1;}
      else{out.push({i:i,mo:null,avail:n-1-i});break;}
    }else i++;
  }
  return out;
}
function withHist(U){return U.filter(function(x){return !!D.hist[x.k];});}
function levelTable(U,s){
  var H=withHist(U);
  return LEVELS.map(function(T){
    var all=[],names=0;
    H.forEach(function(x){var e=episodes(D.hist[x.k].z,T,s);if(e.length)names++;all=all.concat(e);});
    var res=all.filter(function(e){return e.mo!==null;}).map(function(e){return e.mo;});
    var within=function(h){var base=all.filter(function(e){return e.avail>=h;});var ok=base.filter(function(e){return e.mo!==null&&e.mo<=h;}).length;return base.length?{p:pctOf(ok,base.length),n:base.length}:null;};
    return {T:T,eps:all.length,names:names,med:median(res),w6:within(6),w12:within(12),w24:within(24),open:all.filter(function(e){return e.mo===null;}).length};
  });
}
function leaders(U,T,s){
  var per=[],open=[];
  withHist(U).forEach(function(x){
    var e=episodes(D.hist[x.k].z,T,s),r=e.filter(function(q){return q.mo!==null;}).map(function(q){return q.mo;});
    if(r.length>=2)per.push({x:x,med:median(r),n:r.length});
    var last=e[e.length-1];if(last&&last.mo===null)open.push({x:x,so:last.avail,since:D.hist[x.k].st+last.i});
  });
  per.sort(function(p,q){return p.med-q.med||q.n-p.n;});
  open.sort(function(p,q){return q.so-p.so;});
  var k=Math.min(8,Math.ceil(per.length/2));
  return {fast:per.slice(0,k),slow:per.slice(-k).reverse(),open:open.slice(0,8),openN:open.length,ranked:per.length};
}
function breadth(U){

  H.forEach(function(x){var h=D.hist[x.k];h.z.forEach(function(v,i){var m=h.st+i;cnt[m]=(cnt[m]||0)+1;if(v>=1)u[m]=(u[m]||0)+1;if(v<=-1)o[m]=(o[m]||0)+1;if(m<m0)m0=m;if(m>m1)m1=m;});});

    var lo=b.lo<=-3.5?'below −3σ':b.hi>=3.5?'+3σ and above':sg(b.lo,1).replace('.0','')+' to '+sg(b.hi,1).replace('.0','');
    if(b.lo===-3.5)lo='−3σ and below';
    var list=b.items.slice().sort(function(p,q){return q.a.sigma-p.a.sigma;}).map(function(x){return esc(x.a.ticker);});
    showTip(box,'<b>'+lo+'</b> · '+b.items.length+' name'+(b.items.length===1?'':'s')+(list.length?'<br><span style="opacity:.8">'+list.slice(0,12).join(' ')+(list.length>12?' +'+(list.length-12):'')+'</span>':''),m.L+(i+.5)*m.bw,4);}
  cv.addEventListener('mousemove',pick);cv.addEventListener('click',pick);
  cv.addEventListener('mouseleave',function(){cur=null;drawHist(null);hideTip(box);});
}

var C1='var(--jade)',C2='color-mix(in srgb,var(--jade) 55%,var(--paper))',C3='var(--gold)',C4='var(--rust)',C5='color-mix(in srgb,var(--muted) 45%,var(--paper))';
function healthHtml(U){
  var ok=function(v){return v!==null&&v!==undefined&&isFinite(v);};
  var P=U.filter(function(x){return ok(x.rec.payoutRatio);}),pp=function(f){return P.filter(function(x){return f(x.rec.payoutRatio);}).length;};
  var S=U.filter(function(x){return ok(x.rec.divGrowthYears);}),ss=function(a,b){return S.filter(function(x){var y=Math.floor(x.rec.divGrowthYears);return y>=a&&y<b;}).length;};
  var G=U.filter(function(x){return div3InBand(x.rec)&&ok(x.rec.divGrowth10y);}),gg=function(f){return G.filter(function(x){return f(x.rec.divGrowth3y-x.rec.divGrowth10y);}).length;};
  var h='<section class="sec"><h3>Dividend health of the universe</h3><p class="desc">The same checks as each card’s About panel, counted across every name.</p><div class="bars">';
  if(P.length)h+=segBar('Payout ratio (dividend as a % of earnings)',[{l:'Under 40%',n:pp(function(p){return p>0&&p<40;}),c:C1},{l:'40–60%',n:pp(function(p){return p>=40&&p<60;}),c:C2},{l:'60–80%',n:pp(function(p){return p>=60&&p<80;}),c:C3},{l:'80–100%',n:pp(function(p){return p>=80&&p<=100;}),c:'color-mix(in srgb,var(--rust) 60%,var(--paper))'},{l:'Above 100% or negative earnings',n:pp(function(p){return p>100||p<=0;}),c:C4}],P.length);
  if(S.length)h+=segBar('Years of dividend growth in a row',[{l:'King, 50+',n:ss(50,999),c:C1},{l:'Aristocrat, 25–49',n:ss(25,50),c:C2},{l:'Achiever, 10–24',n:ss(10,25),c:C3},{l:'Challenger, 5–9',n:ss(5,10),c:'color-mix(in srgb,var(--gold) 45%,var(--paper))'},{l:'Under 5',n:ss(0,5),c:C5}],S.length);
  if(G.length)h+=segBar('Dividend growth, last 3 years vs past 10',[{l:'Picking up',n:gg(function(d){return d>1;}),c:C1},{l:'Steady',n:gg(function(d){return d>=-1&&d<=1;}),c:C5},{l:'Slowing',n:gg(function(d){return d<-1;}),c:C3}],G.length);
  h+='</div>';
  if(UNI==='stocks'){
    var F=U.map(function(x){return D.fund[x.k];}).filter(function(f){return f&&f.status==='OK';}),foreign=U.filter(function(x){var f=D.fund[x.k];return f&&f.status==='Foreign filer';}).length;
    if(F.length){
      var num=function(v){return v===''||v===undefined?null:+v;};
      var rows=[
        ['Free cash flow covered the dividend last fiscal year',F.filter(function(f){var c=num(f.fcfCover);return c!==null&&c>=1;}).length,F.filter(function(f){return num(f.fcfCover)!==null;}).length,C1],
        ['Net income fell in 2 or more of the last 3 fiscal years',F.filter(function(f){var c=num(f.niDown);return c!==null&&c>=2;}).length,F.filter(function(f){return num(f.niDown)!==null;}).length,C3],
        ['Revenue shrank over the last 3 fiscal years',F.filter(function(f){var c=num(f.revGrowth);return c!==null&&c<0;}).length,F.filter(function(f){return num(f.revGrowth)!==null;}).length,C3],
        ['Long-term debt up 3 years in a row',F.filter(function(f){return f.debtUp==='Yes';}).length,F.filter(function(f){return f.debtUp==='Yes'||f.debtUp==='No';}).length,C3],
        ['Operating income covers interest less than 3×',F.filter(function(f){var c=num(f.intCover);return c!==null&&c<3;}).length,F.filter(function(f){return num(f.intCover)!==null;}).length,C4],
        ['Negative shareholders’ equity (usually from buybacks)',F.filter(function(f){return f.debtEq==='Negative equity';}).length,F.length,C5]
      ];
      h+='<div style="margin-top:26px"><h4 style="font:500 15px/1.2 var(--serif);margin:0 0 4px">From the annual 10-K filings</h4><p class="desc" style="margin-bottom:6px">'+F.length+' U.S. filers'+(foreign?'; '+foreign+' foreign filers not covered':'')+'.</p>'+
        rows.filter(function(r){return r[2];}).map(function(r){var p=pctOf(r[1],r[2]);return '<div class="pct"><span>'+r[0]+'</span><span class="pb"><span style="width:'+p+'%;background:'+r[3]+'"></span></span><span class="pv">'+r[1]+' of '+r[2]+' · '+p+'%</span></div>';}).join('')+'</div>';
    }
  }
  return h+'</section>';
}
function matrixHtml(U){
  var over=U.filter(function(x){return x.a.sigma<=-1;}),normal=U.filter(function(x){return x.a.sigma>-1&&x.a.sigma<1;}),under=U.filter(function(x){return x.a.sigma>=1;});
  var cols=[{key:'all',label:'All',range:'',items:U},{key:'over',label:'Overvalued',range:'−1σ or lower',cls:'over',items:over},{key:'normal',label:'Normal',range:'−1σ to +1σ',items:normal},{key:'under',label:'Undervalued',range:'+1σ or higher',cls:'under',items:under}];

  var avgRow=function(m){return '<tr><td>'+esc(m.label)+'</td>'+cols.map(function(c){return '<td>'+fmtMetric(m.type,avgOf(c.items,m.get).avg)+'</td>';}).join('')+'</tr>';};

function footHtml(){

    '<span><a href="'+esc(LINKS.methodology)+'" target="_blank" rel="noopener">Yield Sigma methodology</a> · <a href="'+esc(LINKS.fieldGuide)+'" target="_blank" rel="noopener">Card field guide</a></span>'+
