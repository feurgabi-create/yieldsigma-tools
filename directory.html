function parseCSV(text){
  var rows=[],row=[],field='',inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQuotes=false; }
      else field+=c;
    }else{
      if(c==='"')inQuotes=true;
      else if(c===',' ){row.push(field);field='';}
      else if(c==='\r'){}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  row.push(field);
  if(row.length>1||row[0]!=='')rows.push(row);
  return rows;
}
function csvTextToLines(text){
  var rows=parseCSV(text).filter(function(r){return r.some(function(c){return c.trim()!=='';});});
  var lines=rows.map(function(r){return r.join('\t').trim();}).filter(Boolean);
  if(lines.length>1){
    var firstCells=splitRow(lines[0]);
    if(firstCells.length>1&&parseMoney(firstCells[1])===null)lines.shift();
  }
  return lines;
}

function psSig(r,y){var st=psStats(r,y);if(st)return (y-st.mean)/st.sd;return (r.avg!==null&&r.sd)?(y-r.avg)/r.sd:null;}
function psPriceAt(r,z){if(r.avg===null||!r.sd||!(r.div>0))return null;var lo=1e-4,hi=Math.max(100,r.avg*100),sl=psSig(r,lo),sh=psSig(r,hi);
  if(sl===null||sh===null||z<sl||z>sh)return null;for(var i=0;i<80;i++){var mid=(lo+hi)/2;if(psSig(r,mid)<z)lo=mid;else hi=mid;}return r.div/(((lo+hi)/2)/100);}

function preFill(kind){
  var thr=kind==='reits'?1.5:1,now=new Date(),curM=now.getFullYear()*12+now.getMonth();
  DATA[kind].forEach(function(r){
    var o=PRE.get(r.ticker);r.bPx=o.p>0?o.p:null;r.bDt=o.d||null;
    r.bDtN=r.bDt?(+r.bDt.slice(0,4)*12+(+r.bDt.slice(5,7)-1)):null;
    r.yoc=(r.bPx&&r.div>0)?r.div/r.bPx*100:null;
    r.chgB=(r.bPx&&r.price>0)?(r.price/r.bPx-1)*100:null;
    var hz=CS.hz[tkKey(r.ticker)];r.sigB=null;
    if(r.bDtN!==null){if(r.bDtN>=curM)r.sigB=r.sigma;else if(hz&&r.bDtN-hz.st>=0&&r.bDtN-hz.st<hz.z.length)r.sigB=hz.z[r.bDtN-hz.st];}
    /* total return since purchase: stock price change + dividends paid since the purchase month (the history's
       yearly dividend amounts, 1/12 per month; this year at today's dividend amount), not reinvested */
    r.tr=null;r.trY=null;
    if(r.bPx&&r.bDtN!==null&&r.price>0&&r.bDtN<curM){var dy=CS.divy[tkKey(r.ticker)]||{},sum=0;
      for(var mo=r.bDtN+1;mo<=curM;mo++){var yr=Math.floor(mo/12),dv=(yr>=now.getFullYear())?r.div:(dy[String(yr)]>0?dy[String(yr)]:r.div);if(dv>0)sum+=dv/12;}
      r.tr=(r.price-r.bPx+sum)/r.bPx*100;var yrs=(curM-r.bDtN)/12;
      if(yrs>=1&&r.tr>-100)r.trY=(Math.pow(1+r.tr/100,1/yrs)-1)*100;}
  });
}

function markFree(rows,kind){
  var under=rows.filter(function(r){return zoneOf(kind,r.sigma)==='under';}).sort(function(p,q){return q.sigma-p.sigma;});
  var over=rows.filter(function(r){return zoneOf(kind,r.sigma)==='over';}).sort(function(p,q){return p.sigma-q.sigma;});
  /* normal band: closest to 0 sigma first */
  var normal=rows.filter(function(r){return zoneOf(kind,r.sigma)==='normal';}).sort(function(p,q){return Math.abs(p.sigma)-Math.abs(q.sigma);});
  [under,over,normal].forEach(function(list){
    list.forEach(function(r,i){if((window.YS_ACCESS&&YS_ACCESS.ok())||(i<FREE_BAND&&i%FREE_STEP===0))r.free=true;});
  });
}

function cmp(a,b,key){
  var x=a[key],y=b[key];
  if(key==='sector'){if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;}
  if(key==='name'||key==='ticker'||key==='sector'){x=String(x).toLowerCase();y=String(y).toLowerCase();return x<y?-1:x>y?1:0;}
  var xn=(x===null||x===undefined),yn=(y===null||y===undefined);
  if(xn&&yn)return 0;if(xn)return 1;if(yn)return -1;   // blanks always last
  return x-y;
}

    if(STATE.watch&&!(window.YS_WATCH&&YS_WATCH.has(r.ticker)))return false;
    if(STATE.kind==='stocks'&&STATE.sector&&r.sector!==STATE.sector)return false;
    if(q&&r.name.toLowerCase().indexOf(q)<0&&r.ticker.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var key=STATE.sort==='bDt'?'bDtN':STATE.sort,dir=STATE.dir;
  rows.sort(function(a,b){
    var c=cmp(a,b,key);
    if((a[key]===null)!==(b[key]===null))return c; // keep blanks last in both directions
    return c*dir||cmp(a,b,'name');
  });
  return rows;
}

/* the top scrollbar mirrors the table's own, so a wide table can be scrolled without going to the bottom */
function syncTopScroll(){
  var ts=$('#topScroll'),tw=$('#tblWrap');if(!ts||!tw)return;
  var t=tw.querySelector('table');if(!t)return;
  /* header row frozen while scrolling: the page holds it when the table fits; when it does not fit,
     the table scrolls inside a screen-high box (sideways scrollbar always in view) and the box holds it */
  tw.classList.remove('box');
  var wide=t.scrollWidth>tw.clientWidth+2;
  if(wide&&!tw.classList.contains('fixed'))tw.classList.add('box');
  ts.firstChild.style.width=t.scrollWidth+'px';
  ts.classList.remove('on');
  ts.onscroll=function(){if(tw.scrollLeft!==ts.scrollLeft)tw.scrollLeft=ts.scrollLeft;};
  tw.onscroll=function(){if(ts.scrollLeft!==tw.scrollLeft)ts.scrollLeft=tw.scrollLeft;};
}
window.addEventListener('resize',function(){try{syncTopScroll();}catch(e){}});

  if(st&&window.YS_WATCH){e.preventDefault();e.stopPropagation();YS_WATCH.toggle(st.getAttribute('data-star'));render();return;}
  var wb=e.target.closest&&e.target.closest('[data-watch]');
  if(wb){STATE.watch=!STATE.watch;render();return;}
  var pi=e.target.closest&&e.target.closest('#preI');
  if(pi){var pn=document.getElementById('preNote');if(pn){pn.hidden=!pn.hidden;pi.setAttribute('aria-expanded',pn.hidden?'false':'true');}return;}
  var pb=e.target.closest&&e.target.closest('[data-pre]');
  if(pb){STATE.pre=!STATE.pre;render();return;}
  var pe=e.target.closest&&e.target.closest('.pEdit');
  if(pe){e.preventDefault();var t=pe.getAttribute('data-pe'),fld=pe.getAttribute('data-f'),cur=PRE.get(t)[fld];
    if(fld==='d'){
      /* purchase month: month + year dropdowns (a browser month picker closes the field before you can pick) */
      var yNow=new Date().getFullYear(),cm=cur?+cur.slice(5,7):0,cy=cur?+cur.slice(0,4):0,box=document.createElement('span');box.className='pSel';
      var sm='<select class="pInp" data-p="m" aria-label="Purchase month"><option value="">Month</option>'+MONS.map(function(m,i){return '<option value="'+(i+1)+'"'+(cm===i+1?' selected':'')+'>'+m+'</option>';}).join('')+'</select>';
      var sy='<select class="pInp" data-p="y" aria-label="Purchase year"><option value="">Year</option>';for(var yy=yNow;yy>=1990;yy--)sy+='<option value="'+yy+'"'+(cy===yy?' selected':'')+'>'+yy+'</option>';sy+='</select>';
      box.innerHTML=sm+sy+(cur?'<button type="button" class="pClr" title="Remove the purchase month">\u2715</button>':'')+'<button type="button" class="pClr" data-x="1" title="Close">Done</button>';
      pe.replaceWith(box);
      var selM=box.querySelector('[data-p="m"]'),selY=box.querySelector('[data-p="y"]');
      var commit=function(){if(selM.value&&selY.value){PRE.set(t,'d',selY.value+'-'+('0'+selM.value).slice(-2));render();}};
      selM.addEventListener('change',commit);selY.addEventListener('change',commit);
      box.addEventListener('click',function(ev){var b=ev.target.closest('.pClr');if(!b)return;ev.stopPropagation();if(!b.hasAttribute('data-x'))PRE.set(t,'d',null);render();});
      selM.focus();
      return;}
    var inp=document.createElement('input');inp.className='pInp';
    inp.type='text';inp.inputMode='decimal';inp.placeholder='e.g. 82.50';inp.value=cur?String(cur):'';
    pe.replaceWith(inp);inp.focus();
    var done=false,save=function(keep){if(done)return;done=true;
      if(keep){var v=inp.value.trim();
        if(fld==='p'){v=v.replace(/[$,\s]/g,'');var n=parseFloat(v);PRE.set(t,'p',(n>0&&isFinite(n))?Math.round(n*10000)/10000:null);}
        else PRE.set(t,'d',/^\d{4}-\d{2}$/.test(v)?v:null);}
      render();};
    inp.addEventListener('keydown',function(k){if(k.key==='Enter'){save(true);}else if(k.key==='Escape'){save(false);}});
    inp.addEventListener('blur',function(){save(true);});
    return;}
},true);
if(window.YS_WATCH)YS_WATCH.on(function(){try{render();}catch(e){}});
function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('.sortBtn'),function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-key');
      if(STATE.sort===k)STATE.dir=-STATE.dir;
      else{STATE.sort=k;STATE.dir=(k==='name'||k==='ticker'||k==='sector')?1:-1;}
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.addEventListener('click',function(){STATE.kind=b.getAttribute('data-kind');render();});
  });
  $('#q').addEventListener('input',function(e){STATE.q=e.target.value;render();});
  var wc=$('#wCopy');if(wc)wc.addEventListener('click',function(){var l=YS_WATCH.link();var done=function(){wc.textContent='Link copied';setTimeout(function(){wc.textContent='Copy my list link';},1600);};
    if(navigator.clipboard)navigator.clipboard.writeText(l).then(done,function(){prompt('Copy this link:',l);});else prompt('Copy this link:',l);});
  syncTopScroll();
  Array.prototype.forEach.call(document.querySelectorAll('[data-set]'),function(b){b.addEventListener('click',function(){STATE.set=b.getAttribute('data-set');render();});});
  Array.prototype.forEach.call(document.querySelectorAll('[data-zone]'),function(b){b.addEventListener('click',function(){STATE.zone=b.getAttribute('data-zone');render();});});
  var ss=$('#secSel');if(ss)ss.addEventListener('change',function(e){STATE.sector=e.target.value;render();});
  $('#long25').addEventListener('change',function(e){STATE.long25=e.target.checked;render();});
  $('#refresh').addEventListener('click',load);
}
function load(){
  return fetchLiveRows(LIVE_URL_STOCKS,LIVE_URL_REITS).then(function(res){
    if(!res||!res.lines||!res.lines.length)throw new Error('empty');
    DATA=buildRows(res.lines,res.tags);
    bellCheck();
    lastUpdated=new Date();
    render();
  }).catch(function(){
    if(!DATA.stocks.length&&!DATA.reits.length)$('#sheet').innerHTML='<div class="empty">Couldn’t reach the data just now. Try Refresh in a minute.</div>';
  });
}
/* bell popover */
function bellClose(){var p=document.getElementById('bellPop');if(p)p.remove();}
function bellOpen(btn){
  bellClose();var t=btn.getAttribute('data-bell'),b=BELL.get(t),r=bellRow(t),k=b?b.k:'sigUp';
  var p=document.createElement('div');p.className='bellPop';p.id='bellPop';
  var rang=b&&b.hit?'<p class="bpRang">'+(b.ack?'Condition met':'Rang')+': '+esc(BELL_K[b.k][0])+' <b>'+esc(bellFmt(b.k,b.v))+'</b> \u00b7 now <b>'+esc(bellFmt(b.k,bellNow(r,b.k)))+'</b> \u00b7 since '+esc(new Date(b.hit+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}))+'</p>':'';
  p.innerHTML='<button type="button" class="x" data-bp="close" aria-label="Close">\u2715</button><h5>Alert for '+esc(t)+'</h5>'+rang+
    '<div class="bpRow"><select id="bpK">'+Object.keys(BELL_K).map(function(x){return '<option value="'+x+'"'+(x===k?' selected':'')+'>'+BELL_K[x][0]+'</option>';}).join('')+'</select>'+
    '<input id="bpV" type="text" inputmode="decimal" value="'+(b?esc(String(b.v)):'')+'" placeholder="level"></div>'+
    '<p class="bpNow" id="bpNow"></p>'+
    '<div class="bpBtns"><button type="button" class="pri" data-bp="save">'+(b?'Update':'Set alert')+'</button>'+(b&&b.hit&&!b.ack?'<button type="button" data-bp="ack">Keep armed</button>':'')+(b?'<button type="button" data-bp="del">Remove</button>':'')+'</div>';
  document.body.appendChild(p);
  var rc=btn.getBoundingClientRect();p.style.left=Math.max(8,Math.min(window.scrollX+rc.left,window.scrollX+document.documentElement.clientWidth-300))+'px';p.style.top=(window.scrollY+rc.bottom+6)+'px';
  var nowLine=function(){var kk=$('#bpK').value;$('#bpNow').textContent='Now: '+bellFmt(kk,bellNow(r,kk));};
  nowLine();$('#bpK').addEventListener('change',nowLine);$('#bpV').focus();
  $('#bpV').addEventListener('keydown',function(e){if(e.key==='Enter')p.querySelector('[data-bp="save"]').click();if(e.key==='Escape')bellClose();});
  p.addEventListener('click',function(e){var a=e.target.closest('[data-bp]');if(!a)return;var act=a.getAttribute('data-bp');
    if(act==='close'){bellClose();return;}
    if(act==='del'){BELL.set(t,null);bellClose();render();return;}
    if(act==='ack'){var o=BELL.get(t);if(o){o.ack=true;BELL.set(t,o);}bellClose();render();return;}
    if(act==='save'){var kk=$('#bpK').value,v=parseFloat(String($('#bpV').value).replace(/[$%σ,\s+]/g,'').replace('\u2212','-'));
      if(!isFinite(v)){$('#bpV').focus();$('#bpV').style.borderColor='var(--rust)';return;}
      /* already true when set: it rings right away (Keep armed quiets it until it has been false and comes true again) */
      var m=bellMet(r,{k:kk,v:v});BELL.set(t,{k:kk,v:v,hit:m?new Date().toISOString().slice(0,10):null,ack:false});
      if(window.YS_WATCH&&!YS_WATCH.has(t))YS_WATCH.toggle(t);
      bellClose();render();}
  });
}
document.addEventListener('click',function(e){
  var bb=e.target.closest&&e.target.closest('[data-bell]');
  if(bb){e.preventDefault();e.stopPropagation();var open=document.getElementById('bellPop');if(open&&open.getAttribute('data-t')===bb.getAttribute('data-bell')){bellClose();return;}bellOpen(bb);var p=document.getElementById('bellPop');if(p)p.setAttribute('data-t',bb.getAttribute('data-bell'));return;}
  if(!(e.target.closest&&e.target.closest('#bellPop')))bellClose();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')bellClose();});
render();
load();
setInterval(load,15*60*1000);

})();
</script>
<script>
/* Opened over a Yield Sigma card (?embed=1): a click on a stock's card
   link sends the ticker back to that card instead of opening a new tab. */
(function(){
  if(window.parent===window)return;
  /* over a card (embed=1) or in the workspace (ws=1): a click loads the name there instead of a new tab */
  var on=false;try{var q=new URLSearchParams(location.search);on=q.get('embed')==='1'||q.get('ws')==='1';}catch(e){}
  if(!on)return;
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href*="ticker="]');if(!a)return;
    var m=a.getAttribute('href').match(/[?&]ticker=([^&#]+)/);if(!m)return;
    e.preventDefault();
    window.parent.postMessage({ysPick:decodeURIComponent(m[1])},'*');
  },true);
})();
</script>
