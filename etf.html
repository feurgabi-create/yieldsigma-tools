<style>

.ysThemeBtn .sun{display:none}.ysThemeBtn[aria-pressed="true"] .sun{display:block}.ysThemeBtn[aria-pressed="true"] .moon{display:none}
.infoI{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border:1px solid currentColor;border-radius:50%;background:none;color:var(--muted);font:italic 600 10px/1 Georgia,serif;cursor:pointer;padding:0;vertical-align:2px;margin-left:6px}

.wIn{width:5.5em;border:1px solid var(--rule);border-radius:6px;background:var(--field);padding:3px 6px;text-align:right}
.tot{font-size:12px;font-weight:600}

.x:hover{color:var(--rust)}
/* ETF view */
.eHead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px 24px;margin-bottom:16px}
.eHead .ySym{font-size:34px;line-height:1}
.eHead .nm{font:500 18px/1.2 var(--serif);margin-top:6px}
.eHead .meta{font-size:11.5px;color:var(--muted);margin-top:6px}
.px{text-align:right}
.px .p{font-size:30px;font-weight:700;line-height:1}
.px .c{font-size:13px;font-weight:600;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:22px}
.stat{padding:11px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 -1px -1px 0}
.stat .k{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.stat .v{font-size:17px;font-weight:700;margin-top:3px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
.chart svg{width:100%;height:auto;display:block}
.bars div.b{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 4.2em;gap:10px;align-items:center;font-size:12px;margin:5px 0}
.bars .tr{height:8px;background:var(--jade-soft);border-radius:4px;overflow:hidden}
.bars .fi{height:100%;background:var(--jade);border-radius:4px}
.bars .pc{text-align:right;font-weight:600}
.sug{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.sug h4{margin:0 0 6px;font-size:12px;font-weight:700}
.sug ul{margin:0;padding-left:18px;font-size:12.5px}
.sug li{margin:3px 0}
.ysStar{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 6px 0 0;vertical-align:-1px}.ysStar:hover,.ysStar.on{color:var(--gold)}
td.wb{white-space:nowrap;text-align:right}td.wb .ysBell{vertical-align:-3px}
.back{font-size:12px;text-decoration:none;font-weight:600}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font:15px/1.6 var(--serif);border:1px dashed var(--rule);border-radius:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media (max-width:760px){
  .stage{padding:0}.sheet{padding:22px 16px}
  .bGrid,.two{grid-template-columns:minmax(0,1fr)}
  .px{text-align:left}
  .eHead .ySym{font-size:28px}
}

<body>
<main class="stage"><div class="ysThemeAnchor"><div id="ysToolsSlot" class="ysTSlot"></div><script>document.write(window.YS_THEME?YS_THEME.button():"")</script></div><article class="sheet" id="sheet"><div class="empty">Loading the Yield Sigma list…</div></article></main>
<div class="toast" id="toast"></div>
<script>
/* Yield Sigma(TM) ETFs (Stardust Capital Labs, Nov 2026)
   A user builds a mock ETF from the Yield Sigma list. It starts at a price its creator picks (default $100) on the day it is created.
   Saved to the visitor's account (Firestore, through auth.js); a link (?e=YABCD) shows any ETF live to anyone.
   Prices, dividends and sigma come from the same gist as every other page; month-end prices
   (history.csv) give the chart its points between visits. */
var GIST="https://gist.githubusercontent.com/feurgabi-create/94abe3b6de993ea6a6e888053b242b82/raw/";
var LINKS={home:"https://www.yieldsigma.com",labs:"https://www.stardustcapital.net/stardust-capital-labs",
  card:"https://tools.yieldsigma.com/card-undervalued.html?ticker=",cardReit:"https://tools.yieldsigma.com/card-reits.html?ticker="};
/* house ETFs: reserved symbols, launched by Stardust Capital Labs */
var HOUSE=[
  {sym:'YSGMA',name:'Yield Sigma Strategy'},
  {sym:'YKING',name:'Dividend Kings'},
  {sym:'YREIT',name:'Yield Sigma REITs'},
  {sym:'YBELL',name:'Textbook and Defined bell curves'},
  {sym:'YSCTO',name:'Yield Sigma Sectors'}
];
var HM_GROUPS=(window.YS_SECTORS&&YS_SECTORS.groups)||[["Health Care","XLV","ABBV AMGN BMY CAH GILD JNJ LLY MDT MRK PRGO UNH"],["Technology","XLK","ACN ADP AVGO BMI BR CAPMF CSCO CTSH DOX HPQ IBM INTU MSFT OTEX PAYX QCOM SWKS TRI TXN"],["Consumer Staples","XLP","ADM BF_B BTI CL CLX COST GIS HRL HSY INGR KMB KO KR MDLZ MKC MO MZTI PEP PG PM SJM SYY TGT TSN UVV WMT"],["Consumer Discretionary","XLY","BBY GPC HD HRB LOW MCD NKE PAG TJX TSCO UPBD SBUX YUM DRI"],["Financials","XLF","AFG AFL ALL AMP AMSF ARCC ARES BAM BANF BEN BXSL CBU CINF CME CNA CNS CSWC CTBI FCBC FIS FNF FNLC HASI ICE IVZ JPM MAIN ORI OWL PEBO PFG PGR PRU RF RLI SBSI TROW TRV UBSI UNM USB WRB BAC GS"],["Industrials","XLI","BAH CAT EMR ETN FAST GD ITW LMT MATW R RHI RTX SNA SWK TNC TRN WM"],["Materials","XLB","AMCR APD EMN NTR SCL SHW SON WLK"],["Energy","XLE","CVX DKL ENB EOG EPD ET KMI MPLX NOG OKE PSX VLO WES XOM"],["Utilities","XLU","AES ARTNA AVA AWR BEP BIP BKH HZN CWEN CWT DUK ED EIX ES HTO NEE NFG NWE NWN OGE OGS POR SGU SO SR UGI WEC WTRG"],["Communication Services","XLC","CMCSA VZ WLY"]];

/* ---------- small helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function key(t){return String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function num(s){if(s==null)return null;var t=String(s).trim();if(!t||/^#/.test(t))return null;var neg=/^\(.*\)$/.test(t);t=t.replace(/[^0-9.\-]/g,'');if(t===''||t==='-')return null;var v=parseFloat(t);return isFinite(v)?(neg?-v:v):null;}
function f2(v){return v==null||!isFinite(v)?'–':v.toFixed(2);}
function money(v){return v==null||!isFinite(v)?'–':'$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function pct(v,d){return v==null||!isFinite(v)?'–':v.toFixed(d==null?2:d)+'%';}
function chg(v){if(v==null||!isFinite(v))return '<span class="mut">–</span>';return '<span class="'+(v>0.004?'pos':v<-0.004?'neg':'mut')+'">'+(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+'%</span>';}
function sg(v){if(v==null||!isFinite(v))return '–';return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+'σ';}
function sym(s){s=String(s||'');return '<span class="ySym"><span class="yY">'+esc(s.charAt(0))+'</span>'+esc(s.slice(1))+'</span>';}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dnum(iso){var p=iso.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5;}
function isoOf(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){var p=iso.split('-');return MON[+p[1]-1]+' '+(+p[2])+', '+p[0];}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on');},1800);}
function tip(label,t){return '<span data-tip="'+esc(t)+'">'+label+'</span>';}
function infoI(id){return '<button type="button" class="infoI" aria-label="More" data-info="'+id+'">i</button>';}
function infoPop(id,html){return '<div class="infoPop" id="ip_'+id+'">'+html+'</div>';}

/* ---------- data ---------- */
var COLS=['nameRaw','price','low52w','divDollar','yield','avg10y','oneSD','divGrowth10y','sigma','ticker','direction','ddm','par','volatility','notes','cagr5y','cagr10y','pe','ma200','ma200diff','maxSigma','avMaxY','max1std','maxDiffCurrent','volMY','parMY','price1sig','price2sig','yieldPremium','divIn10y','divChecks10y','pv','tnxSpread','divGrowthYears','payoutRatio','divGrowth3y'];
var COLS_R=['nameRaw','price','low52w','divDollar','yield','avg10y','oneSD','divGrowth10y','sigma','ticker','yieldDiffK','par','volatility','notes','fv5yr','cagr5y','cagr10y','pffr','ma200','ma200diff','maxSigma','avMaxY','max1std','maxDiffCurrent','volMY','parMY','price1sig','price2sig','tnxSpread','divGrowthYears','affo','pAffo','payoutRatio','divGrowth3y','direction'];
function parseCSV(text){var rows=[],row=[],f='',q=false;for(var i=0;i<text.length;i++){var c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\r'){}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else f+=c;}}row.push(f);if(row.length>1||row[0]!=='')rows.push(row);return rows;}
var SECT={};HM_GROUPS.forEach(function(g){g[2].split(' ').forEach(function(t){SECT[key(t)]=g[0];});});
var U={};          /* key -> security */
var H={};          /* key -> {st (month index), p:[month-end prices]} */
var LIVE_AT=null;
function get(url){return fetch(url+'?h='+Math.floor(Date.now()/600000),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();}).catch(function(){return '';});}
function addRows(txt,kind){
  parseCSV(txt||'').forEach(function(r){
    var cols=kind==='reit'?COLS_R:COLS,o={};cols.forEach(function(c,i){o[c]=r[i];});
    var price=num(o.price);if(!price||price<=0)return;
    var raw=String(o.nameRaw||''),m=raw.match(/^(.*?)\s*\(([^:()]+):([^:()]+)\)\s*$/);
    var t=String(o.ticker||'').trim()||(m?m[3].trim():'');var k=key(t);if(!k||k==='TNX')return;
    var isFund=window.YS_FUNDS&&YS_FUNDS.isFund(k);
    var pe=num(o.pe);if(pe!=null&&(pe<=0||pe>60))pe=null;
    var div=num(o.divDollar);
    U[k]={k:k,t:t,name:(m?m[1]:raw).trim(),kind:isFund?'fund':kind,price:price,div:div,
      yld:div!=null?div/price*100:num(o.yield),avg10y:num(o.avg10y),sigma:num(o.sigma),pe:pe,
      payout:num(o.payoutRatio),g10:num(o.cagr10y),g3:num(o.divGrowth3y),yrs:num(o.divGrowthYears),
      sector:kind==='reit'?'Real Estate':isFund?((window.YS_SECTORS&&YS_SECTORS.funds[k])||'Funds and ETFs'):(SECT[k]||'Other')};
  });
}
function parseHist(txt){
  var L=String(txt||'').split(/\r?\n/);if(!L.length)return;
  var hd=L[0].split('\t'),ix=function(n){return hd.indexOf(n);};
  var iT=ix('ticker'),iF=ix('first'),iP=ix('p'),iZ=ix('z');if(iT<0||iF<0||iP<0)return;
  for(var i=1;i<L.length;i++){var f=L[i].split('\t');if(!f[iT]||!f[iP])continue;
    var st=+f[iF].slice(0,4)*12+(+f[iF].slice(5,7)-1);if(!isFinite(st))continue;
    var nums=function(x){return String(x||'').split(',').map(function(v){v=v.trim();return v===''?null:+v;});};
    H[key(f[iT])]={st:st,p:nums(f[iP]),z:iZ>=0?nums(f[iZ]):[]};}
}
function load(){
  return Promise.all([get(GIST+'stocks.csv'),get(GIST+'reits.csv'),get(GIST+'history.csv')]).then(function(r){
    addRows(r[0],'stock');addRows(r[1],'reit');parseHist(r[2]);LIVE_AT=new Date();
  });
}
/* month-end price of a name (month index m = year*12 + month0) */
function monthPrice(k,m){var h=H[k];if(!h)return null;var v=h.p[m-h.st];return v==null||!isFinite(v)?null:v;}

/* ---------- accounts (Firebase through auth.js) ----------
   etfs/{SYM} (anyone can view; one owner per ticker, enforced by the database rules):
     {owner, name, div:'re'|'cash', wt:'eq'|'cu', created, house, note, ev:[events], pts:[{d,v}], turn, n}
   pts = the chart's points up to the last rebalance (kept so the chart never needs the whole log);
   house ETFs keep only the latest event in public and the full log in etfs/{SYM}/private/log (owner only). */
var ADMIN='QULEPj9TBqTugCa6OtZC5GSUyqA2';

function etfsCol(){return DB.collection('etfs');}

  }).catch(function(e){oops(e);OFF=true;route();});

function onUser(u){

  un.cur=etfsCol().doc(sym).onSnapshot(function(d){CUR=d.exists?fromDoc(d):false;watchPriv();render();},function(e){oops(e);CUR=false;render();});}

  if(un.priv){un.priv();un.priv=null;}PRIV=null;privSym=want;
  if(want)un.priv=etfsCol().doc(want).collection('private').doc('log').onSnapshot(function(d){PRIV=d.exists?d.data():null;render();},oops);

/* ---------- ETF engine ----------
   event = {d: ISO date, u:{KEY:units}, p:{KEY:price that day}, tw:{KEY:target %}, cash: dividends paid out so far}
   Units are set so the ETF's price is its starting price (etf.start, default $100) on the first day; a rebalance resets the units at that
   day's prices, so the price carries on without a jump. Dividends accrue daily from each name's
   current dividend amount: reinvested (the units grow) or paid out (cash builds up beside the price). */
function pxNow(k,ev){var s=U[k];return s?s.price:(ev&&ev.p[k])||null;}
function evAt(etf,iso){var n=dnum(iso),e=etf.ev[0];etf.ev.forEach(function(x){if(dnum(x.d)<=n)e=x;});return e;}
function valueAt(etf,iso,priceFn){
  var e=evAt(etf,iso),days=Math.max(0,dnum(iso)-dnum(e.d)),nav=0,cash=e.cash||0,units={},ok=true;
  Object.keys(e.u).forEach(function(k){
    var p=priceFn(k,e);if(p==null){ok=false;p=e.p[k];}
    var s=U[k],div=s&&s.div!=null?s.div:0,u=e.u[k];
    if(etf.div==='re'){if(p>0)u=u*Math.exp(div/p*days/365);}
    else cash+=u*div*days/365;
    units[k]=u;nav+=u*p;
  });
  return {nav:nav,cash:cash,units:units,ok:ok,ev:e};
}
function now(etf){return valueAt(etf,todayISO(),function(k,e){return pxNow(k,e);});}
function weightsNow(etf,v){var w={};Object.keys(v.units).forEach(function(k){w[k]=v.nav?v.units[k]*(pxNow(k,v.ev)||0)/v.nav*100:0;});return w;}
function makeEvent(nav,cash,tw,iso){
  var u={},p={},t={};Object.keys(tw).forEach(function(k){var px=pxNow(k);if(!px)return;p[k]=px;u[k]=nav*tw[k]/100/px;t[k]=tw[k];});
  return {d:iso,u:u,p:p,tw:t,cash:cash};
}
function startOf(etf){return etf&&etf.start>0?etf.start:100;}
function total(etf,v){return v.nav+(etf.div==='cash'?v.cash:0);}
/* chart points: saved points up to the last rebalance, then each completed month-end, then today */
function series(etf){
  var pts=(etf.pts&&etf.pts.length?etf.pts:[{d:etf.created,v:startOf(etf)}]).slice(),from=pts[pts.length-1].d,c=from.split('-'),m=+c[0]*12+(+c[1]-1),t=todayISO();
  for(;;){var y=Math.floor(m/12),mo=m%12,last=isoOf(Date.UTC(y,mo+1,0)/864e5);if(dnum(last)>=dnum(t))break;
    if(dnum(last)>dnum(from)){var mm=m,v=valueAt(etf,last,function(k){return monthPrice(k,mm);});if(v.ok)pts.push({d:last,v:total(etf,v)});}
    m++;}
  if(dnum(pts[pts.length-1].d)<dnum(t))pts.push({d:t,v:total(etf,now(etf))});return pts;
}
function wavg(w,get){var s=0,ws=0;Object.keys(w).forEach(function(k){var v=U[k]?get(U[k]):null;if(v==null||!isFinite(v))return;s+=w[k]*v;ws+=w[k];});return ws?s/ws:null;}
function wharm(w,get){var s=0,ws=0;Object.keys(w).forEach(function(k){var v=U[k]?get(U[k]):null;if(v==null||!isFinite(v)||v<=0)return;s+=w[k]/v;ws+=w[k];});return s?ws/s:null;}
function turnLine(etf){ /* one-way turnover, per year once the ETF is a year old */
  var yrs=(dnum(todayISO())-dnum(etf.created))/365,t=etf.turn||0;
  return yrs>=1?'Annual turnover '+(t/yrs).toFixed(0)+'%':'Turnover since launch '+t.toFixed(0)+'%';
}
function isReit(k){return U[k]&&U[k].kind==='reit';}
function suggest(etf,v){
  var w=weightsNow(etf,v),tw=v.ev.tw,trim=[],drift=[],add=[];
  Object.keys(w).forEach(function(k){var s=U[k];if(!s||s.sigma==null)return;
    if(s.kind!=='fund'&&s.sigma<(isReit(k)?0:-1))trim.push(k);
    var d=w[k]-(tw[k]||0);if(Math.abs(d)>=Math.max(2,(tw[k]||0)*0.25))drift.push({k:k,now:w[k],tgt:tw[k]});});
  Object.keys(U).forEach(function(k){var s=U[k];if(w[k]!=null||s.kind==='fund'||s.sigma==null)return;if(s.sigma>(s.kind==='reit'?1.5:1))add.push(k);});
  add.sort(function(a,b){return U[b].sigma-U[a].sigma;});
  return {trim:trim,drift:drift,add:add.slice(0,6),w:w};
}

/* ---------- house ETF rules ----------
   YSGMA: stocks (no REITs, no funds) above +1σ with a dividend yield over 3%, the top 20 by σ, equal weight.
   - A holding that leaves the zone (σ at +1 or below, or yield at 3% or below) for 30 days is sold.
   - It is replaced by the highest-σ name that has been in the zone for 30 days.
   - A name in the zone whose σ beats the lowest-σ holding by 0.2 or more for 30 days takes its place.
   - Every change resets the holdings to equal weight.
   The 30 days are counted from the first time the condition is seen; a condition that already held at the last
   month-end (history.csv) counts from that month-end. Changes apply when the owner's account has the page open. */
var RULES={
  YSGMA:{n:20,minS:1,minY:3,gap:0.2,days:30,wt:'eq',note:'Top 20 above +1σ with a dividend yield over 3%; names change after 30 days in or out of the zone'},
  /* YKING: Dividend Kings (50+ years of growth), top 15 by σ, out below 0σ; weighted by 3-year dividend growth
     (10-year when the 3-year figure is blank), each between 2% and 10% */
  YKING:{n:15,minS:0,minY:null,minYrs:50,gap:0.2,days:30,wt:'g3',lo:2,hi:10,note:'Top 15 Dividend Kings by σ, weighted by 3-year dividend growth (2% to 10% each); names change after 30 days in or out of the zone'}
};
function ruleWeights(ru,keys){
  var w={};if(!keys.length)return w;
  if(ru.wt!=='g3'){keys.forEach(function(k){w[k]=100/keys.length;});return w;}
  var raw={},lo=Math.min(ru.lo,100/keys.length),hi=Math.max(ru.hi,100/keys.length);
  keys.forEach(function(k){var s=U[k]||{},g=s.g3!=null?s.g3:s.g10;raw[k]=Math.max(g||0,0.0001);});
  var tot=0;keys.forEach(function(k){tot+=raw[k];});keys.forEach(function(k){w[k]=raw[k]/tot*100;});
  for(var i=0;i<60;i++){var lock={},fix=0,fr=0,ch=false;
    keys.forEach(function(k){if(w[k]>=hi-1e-9){w[k]=hi;lock[k]=1;}else if(w[k]<=lo+1e-9){w[k]=lo;lock[k]=1;}});
    keys.forEach(function(k){if(lock[k])fix+=w[k];else fr+=raw[k];});
    keys.forEach(function(k){if(!lock[k]){var v=fr?raw[k]/fr*(100-fix):0;if(Math.abs(v-w[k])>1e-9)ch=true;w[k]=v;}});
    if(!ch)break;}
  /* everything pinned at a bound and the total is off 100: spread the rest over the names that still have room */
  for(var j=0;j<20;j++){var sum=0;keys.forEach(function(k){sum+=w[k];});var diff=100-sum;if(Math.abs(diff)<1e-6)break;
    var room=keys.filter(function(k){return diff>0?w[k]<hi-1e-9:w[k]>lo+1e-9;});if(!room.length)break;
    var each=diff/room.length;room.forEach(function(k){w[k]=Math.min(hi,Math.max(lo,w[k]+each));});}
  return w;
}
function inZone(k,ru){var s=U[k];return !!s&&s.kind==='stock'&&s.sigma!=null&&s.sigma>ru.minS&&(ru.minY==null||(s.yld!=null&&s.yld>ru.minY))&&(!ru.minYrs||(s.yrs!=null&&s.yrs>=ru.minYrs));}
function ruleTop(ru){return Object.keys(U).filter(function(k){return inZone(k,ru);}).sort(function(a,b){return U[b].sigma-U[a].sigma;}).slice(0,ru.n);}
function lastME(){var d=new Date(),m=d.getFullYear()*12+d.getMonth()-1;return {m:m,iso:isoOf(Date.UTC(Math.floor(m/12),m%12+1,0)/864e5)};}
function zME(k,m){var h=H[k];if(!h||!h.z)return null;var v=h.z[m-h.st];return v==null||!isFinite(v)?null:v;}
var ruleRan={};
function runRules(etf){
  var ru=RULES[etf.sym];if(!ru||!isAdmin()||etf.owner!==ME.uid||ruleRan[etf.sym]||!Object.keys(U).length)return;
  ruleRan[etf.sym]=1;
  var wref=etfsCol().doc(etf.sym).collection('private').doc('watch');
  wref.get().then(function(snap){
    var W=snap.exists?snap.data():{},out=W.out||{},better=W.better||{},inz=W.inz||{},t=todayISO(),me=lastME(),due=function(d){return d&&dnum(t)-dnum(d)>=ru.days;};
    var held=Object.keys(evAt(etf,t).u),why=[];
    /* names in the zone: since when */
    var nin={};Object.keys(U).forEach(function(k){if(!inZone(k,ru))return;var z=zME(k,me.m);nin[k]=inz[k]||(z!=null&&z>ru.minS?me.iso:t);});
    /* holdings out of the zone: since when */
    var nout={};held.forEach(function(k){if(inZone(k,ru))return;var z=zME(k,me.m);nout[k]=out[k]||(z!=null&&z<=ru.minS?me.iso:t);});
    var keep=held.filter(function(k){return !due(nout[k]);}),sold=held.filter(function(k){return due(nout[k]);});
    sold.forEach(function(k){why.push('sold '+(U[k]?U[k].t:k)+' (out of the zone since '+nout[k]+')');});
    var ready=function(){return Object.keys(nin).filter(function(k){return keep.indexOf(k)<0&&due(nin[k]);}).sort(function(a,b){return U[b].sigma-U[a].sigma;});};
    while(keep.length<ru.n){var c=ready()[0];if(!c)break;keep.push(c);why.push('added '+U[c].t+' ('+sg(U[c].sigma)+')');}
    /* swaps: a ready name 0.2σ or more above the lowest holding, for 30 days */
    var nb={};
    for(var guard=0;guard<ru.n;guard++){
      var low=keep.filter(function(k){return U[k]&&U[k].sigma!=null;}).sort(function(a,b){return U[a].sigma-U[b].sigma;})[0],cands=Object.keys(nin).filter(function(k){return keep.indexOf(k)<0;}).sort(function(a,b){return U[b].sigma-U[a].sigma;});
      if(!low||!cands.length)break;var c2=cands[0];if(U[c2].sigma-U[low].sigma<ru.gap)break;
      var zc=zME(c2,me.m),zl=zME(low,me.m);nb[c2]=better[c2]||(zc!=null&&zl!=null&&zc-zl>=ru.gap?me.iso:t);
      if(!due(nb[c2])||!due(nin[c2]))break;
      keep.splice(keep.indexOf(low),1,c2);why.push('swapped '+U[low].t+' ('+sg(U[low].sigma)+') for '+U[c2].t+' ('+sg(U[c2].sigma)+')');
    }
    var save=wref.set({out:nout,better:nb,inz:nin,checked:t});
    if(!why.length)return save;
    var tw=ruleWeights(ru,keep);
    return save.then(function(){return rebalanceEtf(etf,tw,why.join('; '));}).then(function(){toast(etf.sym+': '+why.length+' change'+(why.length>1?'s':'')+' applied');});
  }).catch(function(e){ruleRan[etf.sym]=0;oops(e);});
}

/* ---------- saving ---------- */
function createEtf(o){
  var st=o.start>0?o.start:100,d=todayISO(),e0=makeEvent(st,0,o.tw,d),ref=etfsCol().doc(o.sym);
  var doc={owner:ME.uid,name:o.name,div:o.div,wt:o.wt,created:d,house:!!o.house,note:o.note||'',ev:[e0],pts:[{d:d,v:st}],start:st,turn:0,n:0,rules:o.rules||null};
  return DB.runTransaction(function(t){return t.get(ref).then(function(s){if(s.exists)throw {code:'taken'};t.set(ref,doc);});})
    .then(function(){if(o.house)return ref.collection('private').doc('log').set({ev:[e0]});});
}
function rebalanceEtf(etf,tw,why){
  var v=now(etf),d=todayISO(),w0=weightsNow(etf,v),ne=makeEvent(v.nav,v.cash,tw,d),one=0,all={};if(why)ne.why=why;
  Object.keys(w0).concat(Object.keys(ne.tw)).forEach(function(k){all[k]=1;});
  Object.keys(all).forEach(function(k){one+=Math.abs((ne.tw[k]||0)-(w0[k]||0));});one/=2;
  var pts=series(etf).filter(function(p){return dnum(p.d)<dnum(d);});pts.push({d:d,v:total(etf,v)});
  var ref=etfsCol().doc(etf.sym),up={pts:pts,turn:(etf.turn||0)+one,n:(etf.n||0)+1,ev:etf.house?[ne]:etf.ev.concat([ne])};
  return ref.update(up).then(function(){if(etf.house)return ref.collection('private').doc('log').set({ev:FB.firestore.FieldValue.arrayUnion(ne)},{merge:true});});
}
function deleteEtf(etf){var ref=etfsCol().doc(etf.sym);
  return (etf.house?ref.collection('private').doc('log').delete():Promise.resolve()).then(function(){return ref.delete();});}

/* ---------- symbol rules ---------- */
var REMOTE={};   /* SYM -> 'checking' | 'free' | 'taken' */
function symCheck(letters,house){
  var L=String(letters||'').toUpperCase();
  if(!/^[A-Z]{4}$/.test(L))return {ok:false,msg:L.length?'Four letters, A to Z.':''};
  var s='Y'+L;
  if(U[key(s)])return {ok:false,msg:s+' is a ticker on the Yield Sigma list.'};
  var res=HOUSE.some(function(h){return h.sym===s;});
  if(res&&!(house&&isAdmin()))return {ok:false,msg:s+' is reserved for a house ETF.'};
  var r=REMOTE[s];
  if(r==='taken')return {ok:false,msg:s+' is taken.'};
  if(r!=='free')return {ok:false,wait:true,sym:s,msg:'Checking '+s+'…'};
  return {ok:true,msg:s+' is available.',sym:s};
}
function checkRemote(s){if(REMOTE[s]||!DB)return;REMOTE[s]='checking';
  etfsCol().doc(s).get().then(function(d){REMOTE[s]=d.exists?'taken':'free';render();},function(){delete REMOTE[s];});}

function chartSvg(pts,base){base=base||100;
  var W=560,Hh=220,pl=46,pr=12,pt=12,pb=26,x0=dnum(pts[0].d),x1=Math.max(dnum(pts[pts.length-1].d),x0+1);
  var vs=pts.map(function(p){return p.v;}).concat([base]),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs),pad=Math.max((hi-lo)*0.15,1);lo-=pad;hi+=pad;
  var X=function(d){return pl+(dnum(d)-x0)/(x1-x0)*(W-pl-pr);},Y=function(v){return pt+(hi-v)/(hi-lo)*(Hh-pt-pb);};
  var line=pts.map(function(p,i){return (i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ');
  var last=pts[pts.length-1],up=last.v>=base,col=up?'var(--jade)':'var(--rust)';
  var g='';[lo+pad,base,hi-pad].filter(function(v,i){return i===1||Math.abs(v-base)>(hi-lo)*0.08;}).forEach(function(v){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--rule)" '+(v===base?'stroke-dasharray="4 4"':'')+'/><text x="'+(pl-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="12" fill="var(--muted)">$'+v.toFixed(0)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="ETF price since start">'+g+
    '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'+
    pts.map(function(p){return '<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="'+col+'"><title>'+fmtDate(p.d)+': '+money(p.v)+'</title></circle>';}).join('')+
    '<text x="'+pl+'" y="'+(Hh-6)+'" font-size="12" fill="var(--muted)">'+fmtDate(pts[0].d)+'</text><text x="'+(W-pr)+'" y="'+(Hh-6)+'" font-size="12" fill="var(--muted)" text-anchor="end">'+fmtDate(last.d)+'</text></svg>'+
    (pts.length<3?'<div class="note">More points appear at each month-end.</div>':'');
}

/* ---------- search box ---------- */
function searchBox(inp,box,onPick,exclude){
  var hi=0,res=[];
  function draw(){var q=key(inp.value),qn=inp.value.trim().toLowerCase();if(!qn){box.classList.remove('on');return;}
    res=Object.keys(U).filter(function(k){return exclude().indexOf(k)<0&&(k.indexOf(q)===0||U[k].name.toLowerCase().indexOf(qn)>=0);})
      .sort(function(a,b){return (b.indexOf(q)===0)-(a.indexOf(q)===0)||(a===q?-1:b===q?1:0)||a.localeCompare(b);}).slice(0,8);
    hi=0;box.innerHTML=res.length?res.map(function(k,i){var s=U[k];return '<div data-k="'+k+'" class="'+(i===hi?'hi':'')+'"><span><b>'+esc(s.t)+'</b> '+esc(s.name)+'</span><span class="mut">'+sg(s.sigma)+'</span></div>';}).join(''):'<div class="mut">No other match on the list.</div>';
    box.classList.add('on');}
  inp.addEventListener('input',draw);
  inp.addEventListener('keydown',function(e){if(!box.classList.contains('on'))return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+res.length)%Math.max(res.length,1);Array.prototype.forEach.call(box.children,function(c,i){c.classList.toggle('hi',i===hi);});}
    else if(e.key==='Enter'&&res[hi]){e.preventDefault();onPick(res[hi]);}
    else if(e.key==='Escape')box.classList.remove('on');});
  box.addEventListener('mousedown',function(e){var d=e.target.closest('[data-k]');if(d){e.preventDefault();onPick(d.getAttribute('data-k'));}});
  inp.addEventListener('blur',function(){setTimeout(function(){box.classList.remove('on');},120);});
}

  else if(a==='share'){var link='https://tools.yieldsigma.com/etf.html?e='+encodeURIComponent(etf.sym);
    (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(function(){toast('Link copied');},function(){prompt('Copy this link',link);});}
  else if(a==='delete'){if(confirm('Delete '+etf.sym+'? This can’t be undone, and the ticker becomes free for anyone.')){deleteEtf(etf).then(function(){go({mode:'home'});toast(etf.sym+' deleted');},function(e){fail(e,'Deleting');});}}
  else if(a==='rebal'||a==='suggest'){var v=now(etf),w=weightsNow(etf,v),list;
    if(a==='suggest'){var s=suggest(etf,v),keep=Object.keys(w).filter(function(k){return s.trim.indexOf(k)<0;});
      list=keep.map(function(k){return {k:k,w:etf.wt==='eq'?100/keep.length:(v.ev.tw[k]||0)};});}
    else list=Object.keys(w).map(function(k){return {k:k,w:+w[k].toFixed(2)};});
    scale(list);VIEW.reb={list:list,suggested:a==='suggest'};render();}
  else if(a==='rcancel'){VIEW.reb=null;render();}
  else if(a==='rscale'){scale(VIEW.reb.list);render();}
  else if(a==='req'){var L=VIEW.reb.list;L.forEach(function(x){x.w=100/L.length;});scale(L);render();}
  else if(a==='rconfirm'){var tw={};VIEW.reb.list.forEach(function(x){if(+x.w>0)tw[x.k]=+x.w;});VIEW.busy=true;render();
    rebalanceEtf(etf,tw).then(function(){VIEW.busy=false;VIEW.reb=null;render();toast(etf.sym+' rebalanced');},function(e){fail(e,'The rebalance');});}
}
function go(v){VIEW.mode=v.mode;VIEW.sym=v.sym||null;VIEW.reb=null;
  var q=v.mode==='etf'?'?e='+encodeURIComponent(v.sym):'';try{history.pushState(null,'',location.pathname+q);}catch(e){}
  if(v.mode==='etf'&&READY)openSym(v.sym);render();window.scrollTo(0,0);}
window.addEventListener('popstate',route);
function route(){var sp=new URLSearchParams(location.search),e=sp.get('e'),bl=sp.get('build');
  if(bl&&!e){var ks=[];bl.split(',').forEach(function(t){var k=key(t);if(U[k]&&ks.indexOf(k)<0&&ks.length<50)ks.push(k);});
    try{history.replaceState(null,'',location.pathname);}catch(x){}VIEW.mode='home';VIEW.sym=null;VIEW.reb=null;openBuilder(ks);return;}
  if(e){VIEW.mode='etf';VIEW.sym=e.toUpperCase();if(READY)openSym(VIEW.sym);}else{VIEW.mode='home';VIEW.sym=null;}
  VIEW.reb=null;render();}
load().then(connect);
if(window.YS_THEME)YS_THEME.on(function(){render();});
if(window.YS_WATCH)YS_WATCH.on(function(){render();});
</script>
