<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yield Sigma™ workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Yield Sigma(TM) workspace, Stardust Capital Labs (Nov 2026), v2
   Four live tools on one screen, each tile on its own:
   - drag a tile by its title bar to move it; drag any edge or corner to resize it (snaps to the screen and other tiles)
   - − / 100% / + in each tile scales its content; ⤢ expands it to the full screen
   - the card, history and calculator follow the same stock
   - "Copy link" copies a link that opens this exact view (positions, sizes, scales, stock, heat map tab)
   Each visitor's layout is kept in their own browser; a link someone sends overrides it. */
:root{
  --bg:#FFFFFF; --panel:#EEF2ED; --ink:#13241A; --muted:#5E6F63; --rule:#D2DBD1; --jade:#1F7A52; --jade-soft:#E2EFE7;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --serif:'Newsreader',Georgia,serif;
  --bar:40px; --gap:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A14; --panel:#16241C; --ink:#E4ECE6; --muted:#9AAA9F; --rule:#2A3A30; --jade:#4CC28A; --jade-soft:#1E3328; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A14; --panel:#16241C; --ink:#E4ECE6; --muted:#9AAA9F; --rule:#2A3A30; --jade:#4CC28A; --jade-soft:#1E3328; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--panel);color:var(--ink);font:13px/1.4 var(--mono);overflow:hidden}
a{color:var(--jade)}
.top{height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--rule)}
.top h1{margin:0;font:500 19px/1 var(--serif);white-space:nowrap}
.top h1 a{color:var(--ink);text-decoration:none}
.top .by{color:var(--muted);font-size:11.5px;white-space:nowrap}
.top .by a{font-weight:600;text-decoration:none}
.top .sp{flex:1}
.pill{font:600 11.5px/1 var(--mono);color:var(--jade);background:transparent;border:1px solid var(--jade);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--jade);color:var(--bg)}
.link{font:500 11.5px/1 var(--mono);color:var(--muted);background:none;border:0;cursor:pointer;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.desk{position:absolute;left:0;right:0;top:var(--bar);bottom:0}
.tile{position:absolute;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.tile.front{box-shadow:0 8px 28px -10px rgba(10,25,20,.35)}
.tile.max{left:var(--gap)!important;top:var(--gap)!important;width:calc(100% - 2*var(--gap))!important;height:calc(100% - 2*var(--gap))!important;z-index:500!important}
.th{flex:none;height:34px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-bottom:1px solid var(--rule);background:var(--bg);cursor:move;user-select:none;touch-action:none}
.th b{font:600 12px/1 var(--mono);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .grip{color:var(--muted);font-size:13px;letter-spacing:-2px}
.th .sp{flex:1}
.tabs{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex:none}
.tabs button{font:600 11px/1 var(--mono);color:var(--muted);background:none;border:0;padding:5px 9px;cursor:pointer}
.tabs button.on{background:var(--jade);color:var(--bg)}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:999px;flex:none}
.zoom button{font:600 12px/1 var(--mono);color:var(--muted);background:none;border:0;padding:4px 7px;cursor:pointer;min-width:24px}
.zoom button:hover{color:var(--jade)}
.zoom .pct{font-size:10.5px;min-width:40px}
.ib{width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font:600 14px/1 var(--mono);text-decoration:none}
.ib:hover{background:var(--jade-soft);color:var(--jade)}
.vp{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
.vp iframe{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:var(--bg)}
/* resize handles on every edge and corner */
.rz{position:absolute;z-index:3}
.rz.n,.rz.s{left:10px;right:10px;height:8px;cursor:ns-resize}.rz.n{top:-3px}.rz.s{bottom:-3px}
.rz.e,.rz.w{top:10px;bottom:10px;width:8px;cursor:ew-resize}.rz.e{right:-3px}.rz.w{left:-3px}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:14px;height:14px}
.rz.ne{top:-3px;right:-3px;cursor:nesw-resize}.rz.sw{bottom:-3px;left:-3px;cursor:nesw-resize}
.rz.nw{top:-3px;left:-3px;cursor:nwse-resize}.rz.se{bottom:-3px;right:-3px;cursor:nwse-resize}
.rz.se::after{content:'';position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-right:2px solid var(--rule);border-bottom:2px solid var(--rule)}
.tile:hover .rz.se::after{border-color:var(--jade)}
.tile.max .rz{display:none}
body.moving iframe{pointer-events:none}
body.moving{user-select:none}
.toast{position:fixed;left:50%;top:calc(var(--bar) + 10px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 12px/1 var(--mono);padding:9px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:900}
.toast.on{opacity:1}
@media (max-width:760px){
  html,body{overflow:auto}
  .top{position:sticky;top:0;z-index:600;gap:8px;padding:0 10px}
  .top .by,.top .lg{display:none}
  .top h1{font-size:16px}
  .desk{position:static;padding:var(--gap)}
  .tile{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:86vh!important;margin-bottom:var(--gap)}
  .tile.max{position:fixed!important;left:0!important;top:var(--bar)!important;width:100%!important;height:calc(100% - var(--bar))!important}
  .rz{display:none}
  .th{cursor:default}
}
</style>
</head>
<body>
<div class="top">
  <h1><a href="https://www.yieldsigma.com" target="_blank" rel="noopener">Yield Sigma™</a> workspace</h1>
  <span class="by">by <a href="https://www.stardustcapital.net/stardust-capital-labs" target="_blank" rel="noopener">Stardust Capital Labs</a></span>
  <span class="sp"></span>
  <button type="button" class="link" id="reset">Reset layout</button>
  <button type="button" class="pill" id="share">Copy link<span class="lg"> to this view</span></button>
</div>
<div class="desk" id="desk"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var BASE='https://tools.yieldsigma.com/';
try{if(location.hostname==='tools.yieldsigma.com')BASE='';}catch(e){}
var IDS=['card','history','calc','heat'];
var TOOLS={
  card:{title:'Sigma card',src:function(t){return BASE+'card-undervalued.html?ws=1'+(t?'&ticker='+encodeURIComponent(t):'');}},
  history:{title:'History',src:function(t){return BASE+'yield-sigma-history.html?ws=1'+(t?'&t='+encodeURIComponent(t):'');}},
  calc:{title:'Compound calculator',src:function(t){return BASE+'compound-calculator.html?ws=1'+(t?'&a='+encodeURIComponent(t):'');}},
  heat:{title:'Heat maps',src:function(t,hm){
    if(hm==='reits')return BASE+'heat-map-reits.html?ws=1&embed=1';
    if(hm==='macro')return BASE+'heat-map-stocks.html?ws=1&embed=1&view=sector';
    return BASE+'heat-map-stocks.html?ws=1&embed=1';}}
};
function defTiles(){return {card:[0,0,50,50,100],history:[50,0,50,50,100],calc:[0,50,50,50,100],heat:[50,50,50,50,100]};}
var DEF={L:defTiles(),zo:IDS.slice(),max:'',hm:'stocks',t:''};
var KEY='ysWorkspace.v2';
var S=JSON.parse(JSON.stringify(DEF));
var MINW=18,MINH=18,SNAP=1.5;

function clampTile(a){
  var x=+a[0],y=+a[1],w=+a[2],h=+a[3],z=+a[4];
  if(!isFinite(w))w=50;if(!isFinite(h))h=50;
  w=Math.min(100,Math.max(MINW,w));h=Math.min(100,Math.max(MINH,h));
  x=Math.min(100-w,Math.max(0,isFinite(x)?x:0));y=Math.min(100-h,Math.max(0,isFinite(y)?y:0));
  z=Math.min(200,Math.max(40,isFinite(z)?Math.round(z/10)*10:100));
  return [x,y,w,h,z];
}
/* saved layout, then a shared link on top of it */
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){for(var k in DEF)if(sv[k]!==undefined)S[k]=sv[k];}}catch(e){}
var q;try{q=new URLSearchParams(location.search);}catch(e){q=null;}
if(q&&[...q.keys()].length){
  IDS.forEach(function(id){var v=q.get(id);if(v){var p=v.split('_').map(Number);if(p.length>=4)S.L[id]=p.concat(p.length<5?[100]:[]);}});
  S.max=IDS.indexOf(q.get('max'))>=0?q.get('max'):'';
  if(['stocks','reits','macro'].indexOf(q.get('hm'))>=0)S.hm=q.get('hm');
  if(q.get('t'))S.t=q.get('t').trim().toUpperCase().slice(0,12);
}
(function valid(){
  if(!S.L||typeof S.L!=='object')S.L=defTiles();
  IDS.forEach(function(id){S.L[id]=clampTile(Array.isArray(S.L[id])?S.L[id]:defTiles()[id]);});
  if(!Array.isArray(S.zo)||S.zo.length!==4||IDS.some(function(id){return S.zo.indexOf(id)<0;}))S.zo=IDS.slice();
  if(IDS.indexOf(S.max)<0)S.max='';
  if(['stocks','reits','macro'].indexOf(S.hm)<0)S.hm='stocks';
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var desk=document.getElementById('desk'),EL={},FR={};
function header(id){
  var h='<div class="th" data-id="'+id+'"><span class="grip" aria-hidden="true">⋮⋮</span><b>'+TOOLS[id].title+'</b><span class="sp"></span>';
  if(id==='heat')h+='<span class="tabs">'+['stocks','reits','macro'].map(function(k){
      return '<button type="button" data-hm="'+k+'"'+(S.hm===k?' class="on"':'')+'>'+(k==='stocks'?'Stocks':k==='reits'?'REITs':'Macro')+'</button>';}).join('')+'</span>';
  h+='<span class="zoom"><button type="button" data-zm="-1" title="Smaller" aria-label="Smaller">−</button><button type="button" class="pct" data-zm="0" title="Back to 100%"></button><button type="button" data-zm="1" title="Larger" aria-label="Larger">+</button></span>';
  h+='<a class="ib" data-open="'+id+'" href="#" target="_blank" rel="noopener" title="Open on its own page" aria-label="Open on its own page">↗</a>';
  h+='<button type="button" class="ib" data-max="'+id+'" title="Expand" aria-label="Expand">⤢</button></div>';
  return h;
}
function build(){
  IDS.forEach(function(id){
    var d=document.createElement('section');d.className='tile';d.dataset.id=id;
    d.innerHTML=header(id)+'<div class="vp"></div>'+['n','s','e','w','ne','nw','se','sw'].map(function(r){return '<div class="rz '+r+'" data-rz="'+r+'"></div>';}).join('');
    var f=document.createElement('iframe');f.title=TOOLS[id].title;f.src=TOOLS[id].src(S.t,S.hm);
    d.querySelector('.vp').appendChild(f);desk.appendChild(d);EL[id]=d;FR[id]=f;
  });
  place();
}
function place(){
  IDS.forEach(function(id){
    var a=S.L[id],el=EL[id],g='var(--gap)';
    el.style.left='calc('+a[0]+'% + '+g+' / 2)';el.style.top='calc('+a[1]+'% + '+g+' / 2)';
    el.style.width='calc('+a[2]+'% - '+g+')';el.style.height='calc('+a[3]+'% - '+g+')';
    el.style.zIndex=10+S.zo.indexOf(id);
    el.classList.toggle('front',S.zo[3]===id);
    el.classList.toggle('max',S.max===id);
    var s=a[4]/100,f=FR[id];
    f.style.width=(100/s)+'%';f.style.height=(100/s)+'%';f.style.transform=s===1?'':'scale('+s+')';
    el.querySelector('.pct').textContent=a[4]+'%';
    var b=el.querySelector('[data-max]');b.textContent=S.max===id?'⤡':'⤢';b.title=S.max===id?'Back to the layout':'Expand';
    el.querySelector('[data-open]').href=TOOLS[id].src(S.t,S.hm).replace(/([?&])ws=1&?/,'$1').replace(/([?&])embed=1&?/,'$1').replace(/[?&]$/,'');
  });
  save();
}
function front(id){var i=S.zo.indexOf(id);if(i<3){S.zo.splice(i,1);S.zo.push(id);place();}}

/* a click inside a tile's page lands in its iframe, which the desk never hears about:
   watch which iframe has focus and bring that tile to the front */
var lastFocusTile=null;
function focusCheck(){var f=document.activeElement,tile=f&&f.tagName==='IFRAME'&&f.closest('.tile');var id=tile?tile.dataset.id:null;if(id&&id!==lastFocusTile)front(id);lastFocusTile=id;}
window.addEventListener('blur',function(){setTimeout(focusCheck,0);});
setInterval(focusCheck,200);

/* snapping: to the screen edges and to the edges of the other tiles */
function snapV(v,others){for(var i=0;i<others.length;i++)if(Math.abs(v-others[i])<SNAP)return others[i];return Math.round(v*2)/2;}
function edges(id,axis){var o=[0,100];IDS.forEach(function(j){if(j===id)return;var a=S.L[j];if(axis==='x'){o.push(a[0],a[0]+a[2]);}else{o.push(a[1],a[1]+a[3]);}});return o;}

/* move (title bar) and resize (edges, corners) */
var act=null;
function pt(e){var p=e.touches?e.touches[0]:e,r=desk.getBoundingClientRect();return {x:(p.clientX-r.left)/r.width*100,y:(p.clientY-r.top)/r.height*100};}
desk.addEventListener('mousedown',start);desk.addEventListener('touchstart',start,{passive:false});
function start(e){
  var t=e.target,tile=t.closest&&t.closest('.tile');if(!tile)return;
  var id=tile.dataset.id;front(id);
  if(S.max===id||window.innerWidth<=760)return;
  var rz=t.closest('[data-rz]'),th=t.closest('.th');
  if(!rz&&(!th||t.closest('button,a')))return;
  e.preventDefault();
  act={id:id,mode:rz?rz.dataset.rz:'move',p0:pt(e),a0:S.L[id].slice()};
  document.body.classList.add('moving');
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);
}
function mv(e){
  if(!act)return;e.preventDefault();
  var p=pt(e),dx=p.x-act.p0.x,dy=p.y-act.p0.y,a=act.a0.slice(),m=act.mode,ex=edges(act.id,'x'),ey=edges(act.id,'y');
  if(m==='move'){
    var nx=a[0]+dx,ny=a[1]+dy,sx=snapV(nx,ex),sx2=snapV(nx+a[2],ex)-a[2],sy=snapV(ny,ey),sy2=snapV(ny+a[3],ey)-a[3];
    a[0]=Math.abs(sx-nx)<=Math.abs(sx2-nx)?sx:sx2;a[1]=Math.abs(sy-ny)<=Math.abs(sy2-ny)?sy:sy2;
  }else{
    if(m.indexOf('e')>=0){a[2]=snapV(a[0]+a[2]+dx,ex)-a[0];}
    if(m.indexOf('s')>=0){a[3]=snapV(a[1]+a[3]+dy,ey)-a[1];}
    if(m.indexOf('w')>=0){var r=a[0]+a[2],nx2=Math.min(r-MINW,Math.max(0,snapV(a[0]+dx,ex)));a[0]=nx2;a[2]=r-nx2;}
    if(m.indexOf('n')>=0){var b=a[1]+a[3],ny2=Math.min(b-MINH,Math.max(0,snapV(a[1]+dy,ey)));a[1]=ny2;a[3]=b-ny2;}
  }
  S.L[act.id]=clampTile(a);place();
}
function up(){act=null;document.body.classList.remove('moving');
  document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
  document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);}

/* tile buttons */
desk.addEventListener('click',function(e){
  var t=e.target,id;
  var m=t.closest&&t.closest('[data-max]');
  if(m){S.max=S.max===m.dataset.max?'':m.dataset.max;place();return;}
  var z=t.closest&&t.closest('[data-zm]');
  if(z){id=z.closest('.tile').dataset.id;var a=S.L[id],d=+z.dataset.zm;a[4]=d===0?100:Math.min(200,Math.max(40,a[4]+d*10));place();return;}
  var h=t.closest&&t.closest('[data-hm]');
  if(h&&h.dataset.hm!==S.hm){
    S.hm=h.dataset.hm;
    EL.heat.querySelectorAll('[data-hm]').forEach(function(b){b.classList.toggle('on',b.dataset.hm===S.hm);});
    FR.heat.src=TOOLS.heat.src(S.t,S.hm);place();
  }
});
desk.addEventListener('dblclick',function(e){var th=e.target.closest&&e.target.closest('.th');if(!th||e.target.closest('button,a'))return;var id=th.dataset.id;S.max=S.max===id?'':id;place();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.max){S.max='';place();}});

/* linked tiles: card, history and calculator follow one stock */
window.addEventListener('message',function(e){
  var d=e.data;if(!d)return;
  var t=typeof d.ysTicker==='string'?d.ysTicker:typeof d.ysPick==='string'?d.ysPick:null;
  if(!t)return;
  var src=null;for(var id in FR)if(FR[id].contentWindow===e.source)src=id;
  if(!src)return;
  t=t.trim().toUpperCase();
  if(t===S.t&&src!=='heat')return;
  S.t=t;place();
  ['card','history','calc'].forEach(function(id){if(id!==src){try{FR[id].contentWindow.postMessage({ysSelect:t},'*');}catch(x){}}});
  if(src==='heat')toast(t+' loaded in the card, history and calculator');
});

/* share and reset */
var tEl=document.getElementById('toast'),tTm=null;
function toast(msg){tEl.textContent=msg;tEl.classList.add('on');clearTimeout(tTm);tTm=setTimeout(function(){tEl.classList.remove('on');},2200);}
function r1(v){return Math.round(v*10)/10;}
function shareUrl(){
  var p=new URLSearchParams();
  if(S.t)p.set('t',S.t);
  IDS.forEach(function(id){var a=S.L[id];p.set(id,[r1(a[0]),r1(a[1]),r1(a[2]),r1(a[3]),a[4]].join('_'));});
  if(S.max)p.set('max',S.max);
  if(S.hm!=='stocks')p.set('hm',S.hm);
  return 'https://tools.yieldsigma.com/workspace.html?'+p.toString();
}
document.getElementById('share').addEventListener('click',function(){
  var u=shareUrl();
  function fb(){var ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Link copied');}catch(x){toast(u);}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(function(){toast('Link copied');},fb);else fb();
});
document.getElementById('reset').addEventListener('click',function(){
  var hm0=S.hm;S.L=defTiles();S.zo=IDS.slice();S.max='';place();toast('Layout reset');
});

build();
})();
</script>
</body>
</html>
